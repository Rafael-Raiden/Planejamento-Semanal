<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Planejamento TI</title>
<meta name="description" content="Planejamento de atividades e relatórios da TI.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Planejamento TI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Linguagem visual da Vante: preto quase total, tinta quente, fios finos, pílulas e mono nos rótulos */
:root{--papel:#0a0a0b;--painel:#111113;--tinta:#f4f1ea;--suave:#8d8b86;--linha:rgba(244,241,234,.14);--trilho:rgba(244,241,234,.08);--acento:#f4f1ea;--on-acento:#0a0a0b;--ambar:#E8B432;--ambar-t:#E8B432;--perigo:#F0776D;--ok:#4DB57F;--fita:#f4f1ea;--aco:#0a0a0b;--aco2:rgba(244,241,234,.08);--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--papel);scrollbar-color:var(--linha) transparent;accent-color:var(--tinta)}
::selection{background:var(--tinta);color:var(--papel)}
input,textarea{caret-color:var(--tinta)}
::placeholder{color:var(--suave);opacity:1}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 15px/1.5 'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}
h1,h2{margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,4.4vw,56px);font-weight:400;letter-spacing:-.04em}
h2{font-size:17px;font-weight:500;letter-spacing:-.01em;margin-bottom:14px}
.h2b{margin-top:26px}
p{margin:0;text-wrap:pretty}
.suave{color:var(--suave)}
.mono,.cont,.dica,.leg,.sync,.nav-lista button,.tab th,.th-b,.est,.tag-rev,.tag-arq,.chip-prio,.dt,.loc,.seg button,.campo,.kpi span,.kpi em{font-family:var(--mono)}

.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--papel);color:var(--suave);z-index:50;font-family:var(--mono);font-size:12px;letter-spacing:.06em}

/* barra superior */
.app{display:block;min-height:100vh}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;padding:0 32px;height:64px;background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center;gap:9px;flex:none}
.marca::before{content:"";width:22px;height:18px;background:var(--tinta);clip-path:polygon(50% 0,100% 100%,72% 100%,50% 50%,28% 100%,0 100%)}
.fita,.marca-t small{display:none}
.marca-t{font-size:17px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.nav-lista{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-lista::-webkit-scrollbar{display:none}
.nav-lista button{background:none;border:0;padding:8px 12px;color:var(--suave);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px;position:relative;white-space:nowrap;transition:color .15s}
.nav-lista button:hover{color:var(--tinta)}
.nav-lista button.on{color:var(--tinta)}
.nav-lista button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:1px;background:var(--tinta)}
.badge{background:var(--tinta);color:var(--papel);font-size:10.5px;font-weight:500;border-radius:99px;padding:0 6px;min-width:18px;text-align:center}
.sync{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.04em;color:var(--suave);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--suave);flex:none}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--ambar);animation:pulsa 1s ease-in-out infinite}.sync.erro i{background:var(--perigo)}
@keyframes pulsa{50%{opacity:.3}}

#view{padding:36px 32px 80px;max-width:1120px;margin:0 auto;width:100%;min-width:0}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sub{color:var(--suave);margin-top:10px}
.painel{background:transparent;border:0;border-top:1px solid var(--linha);border-radius:0;padding:20px 0 24px;margin:0}
.painel + .painel{margin-top:0}
.sec-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-cab h2{margin:0}
.cont{color:var(--suave);font-weight:400;font-size:12px;margin-left:6px}
.vazio{color:var(--suave);font-size:14px;margin:4px 0}
.dica,.leg{color:var(--suave);font-size:12px;letter-spacing:.02em}
.leg{margin-top:10px}

/* botões em pílula */
button.pri,button.sec,label.sec{border-radius:99px;padding:0 16px;height:34px;font-size:12px;font-weight:500;letter-spacing:.06em;line-height:1;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s}
button.pri{background:var(--tinta);color:var(--papel);border:1px solid var(--tinta)}
button.pri:hover{background:transparent;color:var(--tinta)}
button.sec,label.sec{background:transparent;border:1px solid rgba(244,241,234,.55);color:var(--tinta);cursor:pointer}
button.sec:hover,label.sec:hover{background:var(--tinta);color:var(--papel)}
button.perigo,.perigo{color:var(--perigo)}
button.sec.perigo{border-color:color-mix(in srgb,var(--perigo) 60%,transparent)}
button.sec.perigo:hover{background:var(--perigo);color:var(--papel)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ic{background:transparent;border:1px solid var(--linha);border-radius:99px;width:32px;height:32px;display:grid;place-items:center;padding:0;transition:border-color .2s,background-color .2s}
button.ic:hover{border-color:var(--tinta)}
.botoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.esp{flex:1}
.acoes-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.nav-p{display:flex;align-items:center;gap:8px}
.nav-p strong{min-width:150px;text-align:center;font-weight:500}

.faixa-box{padding-top:20px}
.faixa-cab{display:flex;gap:12px;align-items:baseline;margin-bottom:14px;flex-wrap:wrap}
.faixa-cab b{font-size:34px;font-weight:400;letter-spacing:-.03em}
.faixa-cab span{color:var(--suave)}
.faixa-cab button{margin-left:auto;align-self:center}
.strip{height:14px}

.qadd{display:flex;gap:8px;margin:6px 0 22px}
.qadd input{flex:1;min-width:0;background:transparent;border:1px solid var(--linha);border-radius:99px;padding:0 18px;height:44px;transition:border-color .2s}
.qadd input:hover{border-color:rgba(244,241,234,.35)}
.qadd input:focus{outline:none;border-color:var(--tinta)}
.qadd button{height:44px}

.lista{list-style:none;margin:0;padding:0}
.tarefa{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--linha);min-width:0;transition:background-color .15s}
.tarefa:last-child{border-bottom:0}
.tarefa:hover{background:rgba(244,241,234,.035)}
.chk{flex:none;width:20px;height:20px;border:1px solid var(--suave);background:transparent;border-radius:50%;display:grid;place-items:center;padding:0;color:transparent;transition:border-color .15s,background-color .15s}
.chk:hover{border-color:var(--tinta)}
.tarefa.feita .chk{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.tarefa.andando .chk{border-color:var(--ambar);background:linear-gradient(90deg,var(--ambar) 50%,transparent 50%)}
.tt{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--suave)}
.tarefa.feita .tt,tr.feita .tt{color:var(--suave);text-decoration:line-through;text-decoration-color:var(--linha)}
.tarefa.atrasada .dt{color:var(--perigo)}
.meta{display:flex;gap:12px;align-items:center;flex:none}
.loc,.dt{font-size:11.5px;color:var(--suave);letter-spacing:.02em}
.mini{background:none;border:1px solid var(--linha);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;color:var(--suave);padding:0;transition:color .15s,border-color .15s}
.mini:hover{color:var(--ambar-t);border-color:var(--ambar)}
.tarefa.andando .mini{color:var(--ambar-t);border-color:var(--ambar)}
.tag-rev,.tag-arq{font-size:10.5px;letter-spacing:.04em;border-radius:99px;padding:1px 8px;border:1px solid currentColor}
.tag-rev{color:var(--ambar-t)}
.tag-arq{color:var(--suave)}

textarea,input[type=text],input[type=search],input[type=url],input[type=password],input[type=date],input[type=number],input:not([type]),select{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .2s}
textarea:hover,input:hover,select:hover{border-color:rgba(244,241,234,.3)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--tinta)}
textarea{resize:vertical;line-height:1.45}
.campo{display:grid;gap:6px;font-size:11.5px;letter-spacing:.04em;color:var(--suave);margin-top:14px}
.campo input,.campo select,.campo textarea{color:var(--tinta);font-family:'Inter Tight',system-ui,sans-serif;font-size:15px;letter-spacing:0}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ctl select{width:auto;min-width:170px;border-radius:99px;padding:7px 16px}
.ctl label{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--suave);font-family:var(--mono)}
.ctl input[type=date]{width:auto;border-radius:99px;padding:6px 14px}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none}
.seg button{background:none;border:0;padding:6px 14px;font-size:11.5px;letter-spacing:.04em;color:var(--suave);border-radius:99px;transition:background-color .15s,color .15s}
.seg button:hover{color:var(--tinta)}
.seg button.on{background:var(--tinta);color:var(--papel)}
.ck{display:inline-flex;gap:8px;align-items:center;font-size:12px;white-space:nowrap;font-family:var(--mono)}
.ck input{width:auto}

.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;align-items:stretch;border-top:1px solid var(--linha)}
.dia{border-left:1px solid var(--linha);padding:12px 10px;min-height:160px}
.dia:first-child{border-left:0;padding-left:0}
.dia.hoje{background:rgba(244,241,234,.05)}
.dia.fim .dia-nome{color:var(--suave)}
.dia header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dia-nome{background:none;border:0;padding:0;font-size:13px;flex:1;text-align:left;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.dia-nome b{font-weight:500}
.dia .ic{width:24px;height:24px;font-size:15px}
.lista.compacta .tarefa{padding:6px 0;gap:7px;align-items:flex-start;border-bottom:0}
.lista.compacta .tarefa:hover{background:none}
.lista.compacta .chk{width:15px;height:15px;margin-top:3px}
.lista.compacta .chk svg{width:9px;height:9px}
.lista.compacta .tt{white-space:normal;font-size:13px;line-height:1.3;overflow:visible}
.pt{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}

.filtros{display:grid;grid-template-columns:2fr repeat(4,1fr) auto auto;gap:8px;align-items:center}
.filtros select,.filtros input[type=search]{min-width:0;border-radius:99px;padding:7px 16px;height:36px}
.bulk{position:sticky;top:64px;z-index:5;background:var(--tinta);color:var(--papel);border-radius:14px;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bulk b{font-weight:500}
.bulk select{width:auto;background:transparent;color:var(--papel);border-color:rgba(10,10,11,.35);border-radius:99px;padding:5px 14px}
.bulk select option{color:#111}
.bulk button.sec{color:var(--papel);border-color:rgba(10,10,11,.45)}
.bulk button.sec:hover{background:var(--papel);color:var(--tinta)}
.bulk button.perigo{color:#B3261E}
.tab-box{padding:0;overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.tab th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);font-weight:400;padding:12px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tab td{padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tab tbody tr:hover{background:rgba(244,241,234,.035)}
.tab tr.sel{background:rgba(244,241,234,.07)}
.tab .n{white-space:nowrap;color:var(--suave);font-family:var(--mono);font-size:12.5px}
.tab .c-sel{width:34px}
.tab .c-sel input{width:auto}
.c-tit{max-width:360px}
.c-tit .tt{white-space:normal;display:inline}
.th-b{background:none;border:0;padding:0;color:var(--suave);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.th-b:hover{color:var(--tinta)}
.est{background:none;border:1px solid var(--linha);border-radius:99px;padding:2px 11px;font-size:11.5px;white-space:nowrap;color:var(--suave);transition:border-color .15s,color .15s}
.est:hover{border-color:var(--tinta);color:var(--tinta)}
.est.ok{border-color:var(--ok);color:var(--ok)}
.est.and{border-color:var(--ambar);color:var(--ambar-t)}
.mais{padding:16px;text-align:center}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);margin-bottom:6px}
.kpi{padding:20px 20px 18px;border-left:1px solid var(--linha);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-size:46px;line-height:1;font-weight:400;letter-spacing:-.045em}
.kpi span{display:block;margin-top:10px;color:var(--suave);font-size:11.5px;letter-spacing:.03em}
.kpi em{font-style:normal;font-size:11.5px;margin-left:8px}
.sobe{color:var(--ok)}.desce{color:var(--perigo)}.neutro{color:var(--suave)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}

.dlist{list-style:none;margin:0;padding:0}
.dlist button{display:grid;grid-template-columns:auto auto 1fr;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linha);padding:11px 4px;align-items:baseline;transition:background-color .15s}
.dlist button:hover{background:rgba(244,241,234,.035)}
.dlist b{font-weight:500;font-family:var(--mono);font-size:13px}
.trecho{color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev{width:100%;height:78vh;min-height:520px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.acoes{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.acoes .botoes{margin:0}

dialog{border:1px solid var(--linha);border-radius:18px;background:var(--painel);color:var(--tinta);padding:0;width:min(640px,calc(100vw - 24px));box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog[open]{animation:abre .18s cubic-bezier(.16,1,.3,1)}
@keyframes abre{from{opacity:0;transform:translateY(8px)}}
.ed{padding:24px 26px}
.ed h2{font-size:26px;font-weight:400;letter-spacing:-.03em;margin-bottom:4px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--tinta);color:var(--papel);padding:11px 18px 11px 34px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;position:relative}
.toast::before{content:"";position:absolute;left:16px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ok)}
.toast.erro::before{background:#C8372D}

@media(max-width:1000px){.filtros{grid-template-columns:1fr 1fr 1fr}.filtros #f-q{grid-column:1/-1}.semana{grid-template-columns:repeat(2,minmax(0,1fr));border-top:0}.dia{border:1px solid var(--linha);border-radius:12px;margin:0 0 8px}.dia:first-child{padding-left:10px}.nav .sync{display:none}}
@media(max-width:820px){
  .nav{position:fixed;inset:auto 0 0 0;height:auto;padding:0;border-bottom:0;border-top:1px solid var(--linha);gap:0;background:color-mix(in srgb,var(--papel) 96%,transparent)}
  .marca,.sync{display:none}
  .nav-lista{gap:0}
  .nav-lista button{flex:1 0 auto;justify-content:center;padding:15px 14px}
  .nav-lista button.on::after{left:14px;right:14px;bottom:auto;top:0}
  #view{padding:24px 16px 100px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:16px 14px}
  .kpi:nth-child(3){border-left:0;padding-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--linha)}
  .kpi:nth-child(odd){padding-left:0}
  .kpi b{font-size:38px}
  .grade2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .meta .loc{display:none}
  .meta{gap:8px}
  .bulk{top:0}
  #toasts{bottom:76px}
}
@media(max-width:520px){.tarefa{flex-wrap:wrap}.tarefa .tt{flex-basis:calc(100% - 80px);white-space:normal}.meta{order:3;flex-basis:100%;padding-left:32px;flex-wrap:wrap}.semana{grid-template-columns:1fr}.filtros{grid-template-columns:1fr 1fr}.nav-p strong{min-width:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.nav,#toasts,.boot{display:none}}

</style>
</head>
<body>
<div id="boot" class="boot">Carregando…</div>
<div class="app">
  <nav class="nav" aria-label="Principal">
    <div class="marca"><span class="marca-t">Planejamento TI</span></div>
    <div class="nav-lista">
      <button data-view="hoje">Hoje</button>
      <button data-view="semana">Semana</button>
      <button data-view="tarefas">Tarefas<span class="badge" id="badge-tarefas" hidden></span></button>
      <button data-view="painel">Painel</button>
      <button data-view="diario">Diário</button>
      <button data-view="relatorios">Relatórios</button>
      <button data-view="ajustes">Ajustes</button>
    </div>
    <div id="sync" class="sync busy"><i></i><span>Carregando…</span></div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-label="Editar atividade"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ===== CLASSIFICADOR — as mesmas regras rodam no app e no backend ===== */
var CAT_FOLGA = 'Folga / Férias';

/* A ordem importa: a primeira regra que bate vence. Texto já vem sem acento e em minúsculas. */
var REGRAS_CATEGORIA = [
  ['Folga / Férias', '\\b(folga|ferias|feriado)\\b'],
  ['Reuniões e Treinamentos', '\\b(reuniao|reunioes|treinamento|webinar|capacitacao|palestra)\\b'],
  ['Relatório', '\\b(relat\\w*|checklist)\\b'],
  ['Chamado', '\\bo\\.s\\b|\\bordem de servico\\b|\\bchamados?\\b|\\btickets?\\b|\\batendimento\\b|\\bsuporte\\b|\\bwps sales\\b'],
  ['Acompanhamento', '\\bacom\\w*nh\\w*|\\bast\\b|\\bneo ?net\\b|\\brenova\\b|\\bclaro\\b|\\bterceir\\w*'],
  ['Backup', '\\b(backups?|acronis|datto|kaseya|restore|restauracao)\\b|\\bvm\\b|maquinas? virtua(l|is)'],
  ['Estacionamento e Pagamentos', '\\b(pinpad|tef|sitef|atm|totem|cancelas?|catraca|bilhetagem)\\b|painel de vagas|estacionamento'],

function normalizarTexto(s) {
  var t = String(s == null ? '' : s).toLowerCase();
  if (t.normalize) { t = t.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  return t;
}

function classificarCategoria(titulo) {
  if (!REGRAS_COMPILADAS) {
    REGRAS_COMPILADAS = REGRAS_CATEGORIA.map(function (r) { return [r[0], new RegExp(r[1])]; });
  }
  var n = normalizarTexto(titulo);
  for (var i = 0; i < REGRAS_COMPILADAS.length; i++) {
    if (REGRAS_COMPILADAS[i][1].test(n)) { return REGRAS_COMPILADAS[i][0]; }
  }
  return CATEGORIA_PADRAO;
}

function detectarLocal(titulo) {
  var n = normalizarTexto(titulo);
  if (/\bcorporate\b/.test(n)) { return 'Corporate'; }
  if (/\b(ws ?park|wspark|wps|awa|estacionamento)\b/.test(n)) { return 'WS PARK'; }
  return 'Shopping';
}

function detectarPrioridade(titulo) {
  var n = normalizarTexto(titulo);
  if (/\b(urgente|urgencia|critico|parou|fora do ar|offline|queda|defeito|emergencia)\b|sem funcionar|nao funciona/.test(n)) { return 'Alta'; }
  if (/\b(folga|ferias|feriado|festa)\b|organizacao/.test(n)) { return 'Baixa'; }
  return 'Média';
}

function temFinalizado(titulo) {
  return /finalizad[oa]\.?\s*$/i.test(String(titulo || '').trim());
}

function limparTitulo(titulo) {
  return String(titulo || '').replace(/[\s\-–—.,;:]*finalizad[oa]\.?\s*$/i, '').replace(/\s+/g, ' ').trim();
}

}

async function copiarTexto(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
}

/* itens: [{nome, a, b, cor}] a = feitas (cheio), b = pendentes (cor clara) */
function barrasHTML(itens, o) {

/* itens: [{nome, valor, cor}] */
function rosquinhaHTML(itens, o) {

/* baldes: [{rot, a, b, dica}] a = feitas, b = pendentes (empilhadas) */
function colunasSVG(baldes, o) {
  o = o || {};
  const n = baldes.length;
  if (!n) { return '<p class="vazio">Sem dados no período.</p>'; }
  const alt = o.alt || 150, topo = 18, base = 22;
  const passo = Math.max(14, Math.min(40, Math.floor(420 / n)));
  const W = n * passo + 30, H = alt + topo + base;
  const max = Math.max(1, Math.max.apply(null, baldes.map((b) => b.a + b.b)));
  const esc_y = (v) => (v / max) * alt;
  const salto = Math.ceil(n / 12);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.rotulo || 'Evolução')}" style="max-width:${Math.min(W * 1.6, 760)}px">`;
  s += `<line x1="26" x2="${W}" y1="${topo + alt}" y2="${topo + alt}" style="stroke:var(--linha)"/>`;
  s += `<text x="0" y="${topo + 4}" style="fill:var(--suave);font-size:11px">${max}</text>`;
  baldes.forEach((b, i) => {
    const x = 30 + i * passo, w = Math.max(6, passo - 5);
    const ha = esc_y(b.a), hb = esc_y(b.b);
    s += `<g><title>${esc(b.dica || b.rot)}: ${b.a} concluídas${b.b ? ', ' + b.b + ' pendentes' : ''}</title>`;
    if (b.a) { s += `<rect x="${x}" y="${topo + alt - ha}" width="${w}" height="${ha}" rx="1.5" style="fill:var(--acento)"/>`; }
    if (b.b) { s += `<rect x="${x}" y="${topo + alt - ha - hb}" width="${w}" height="${hb}" rx="1.5" style="fill:var(--ambar)"/>`; }
    s += `<rect x="${x - 2}" y="${topo}" width="${w + 4}" height="${alt}" fill="transparent"/></g>`;
    if (i % salto === 0) { s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" style="fill:var(--suave);font-size:11px">${esc(b.rot)}</text>`; }
  });
  return s + '</svg>';
}

/* mapa: {'aaaa-mm-dd': n}; mostra as últimas `semanas` semanas até `fim` */
function calorSVG(mapa, fim, semanas) {
  semanas = semanas || 26;
  const ultimaSeg = inicioSemana(fim);
  const primeira = addDays(ultimaSeg, -(semanas - 1) * 7);
  const cel = 12, gap = 3, esq = 24, topo = 16;
  const W = esq + semanas * (cel + gap), H = topo + 7 * (cel + gap);
  const max = Math.max(1, Math.max.apply(null, Object.values(mapa).concat([1])));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Atividade por dia" style="max-width:${W * 1.7}px">`;
  ['seg', 'qua', 'sex'].forEach((d, k) => { s += `<text x="0" y="${topo + k * 2 * (cel + gap) + 10}" style="fill:var(--suave);font-size:10px">${d}</text>`; });
  let mesAnt = '';
  for (let w = 0; w < semanas; w++) {
    const ini = addDays(primeira, w * 7);
    const m = ini.slice(0, 7);
    if (m !== mesAnt) { s += `<text x="${esq + w * (cel + gap)}" y="10" style="fill:var(--suave);font-size:10px">${MES_CURTO[parseInt(m.slice(5), 10) - 1]}</text>`; mesAnt = m; }
    for (let d = 0; d < 7; d++) {
      const dia = addDays(ini, d);
      if (dia > fim) { continue; }
      const v = mapa[dia] || 0;
      const op = v === 0 ? 0 : 0.28 + 0.72 * Math.min(1, v / max);
      s += `<rect x="${esq + w * (cel + gap)}" y="${topo + d * (cel + gap)}" width="${cel}" height="${cel}" rx="2" style="fill:var(--trilho)"><title>${fmtBR(dia)}: ${v}</title></rect>`;
      if (v) { s += `<rect x="${esq + w * (cel + gap)}" y="${topo + d * (cel + gap)}" width="${cel}" height="${cel}" rx="2" style="fill:var(--acento)" fill-opacity="${op.toFixed(2)}"><title>${fmtBR(dia)}: ${v}</title></rect>`; }
    }
  }
  return s + '</svg>';
}


/* ===== relatórios: períodos, modelo, HTML exportável, texto e CSV ===== */
const TIPOS_PERIODO = { dia: 'Dia', semana: 'Semana', mes: 'Mês', trimestre: 'Trimestre', ano: 'Ano', livre: 'Personalizado' };

function periodoDe(tipo, ref, livre) {
  ref = ref || hoje();
  let de, ate, rotulo, ant;
  if (tipo === 'dia') {
    de = ate = ref; rotulo = cap(diaLongo(ref)) + ', ' + fmtBR(ref); ant = { de: addDays(ref, -1), ate: addDays(ref, -1) };
  } else if (tipo === 'semana') {
    de = inicioSemana(ref); ate = addDays(de, 6); rotulo = 'Semana de ' + fmtDM(de) + ' a ' + fmtDM(ate) + '/' + ate.slice(0, 4);
    ant = { de: addDays(de, -7), ate: addDays(de, -1) };
  } else if (tipo === 'mes') {
    de = inicioMes(ref); ate = fimMes(ref); rotulo = cap(mesLongo(ref)) + ' de ' + ref.slice(0, 4);
    const pm = addMeses(de, -1); ant = { de: pm, ate: fimMes(pm) };
  } else if (tipo === 'trimestre') {
    const m = parseInt(ref.slice(5, 7), 10), q = Math.floor((m - 1) / 3);
    de = ref.slice(0, 4) + '-' + pad(q * 3 + 1) + '-01'; ate = fimMes(addMeses(de, 2));
    rotulo = (q + 1) + 'º trimestre de ' + ref.slice(0, 4);
    const pd = addMeses(de, -3); ant = { de: pd, ate: fimMes(addMeses(pd, 2)) };
  } else if (tipo === 'ano') {
    de = ref.slice(0, 4) + '-01-01'; ate = ref.slice(0, 4) + '-12-31'; rotulo = 'Ano de ' + ref.slice(0, 4);
    const y = String(parseInt(ref.slice(0, 4), 10) - 1); ant = { de: y + '-01-01', ate: y + '-12-31' };
  } else {
    de = (livre && livre.de) || inicioMes(ref); ate = (livre && livre.ate) || ref;
    if (ate < de) { const x = de; de = ate; ate = x; }
    const n = diffDays(ate, de) + 1;
    rotulo = fmtBR(de) + ' a ' + fmtBR(ate); ant = { de: addDays(de, -n), ate: addDays(de, -1) };
  }
  return { tipo, de, ate, rotulo, ant };
}

function deslocarRef(tipo, ref, passo) {
  if (tipo === 'dia') { return addDays(ref, passo); }
  if (tipo === 'semana') { return addDays(ref, 7 * passo); }
  if (tipo === 'mes') { return addMeses(ref, passo); }
  if (tipo === 'trimestre') { return addMeses(ref, 3 * passo); }
  if (tipo === 'ano') { return String(parseInt(ref.slice(0, 4), 10) + passo) + ref.slice(4); }
  return ref;
}

function variacao(atual, anterior) {
  if (!anterior) { return atual ? { txt: 'novo', cls: 'neutro' } : { txt: '—', cls: 'neutro' }; }
  const d = Math.round(((atual - anterior) / anterior) * 100);
  return { txt: (d > 0 ? '+' : '') + d + '%', cls: d > 0 ? 'sobe' : (d < 0 ? 'desce' : 'neutro') };
}

function montarModelo(tipo, ref, local, livre) {
  const p = periodoDe(tipo, ref, livre);
  const st = calcStats(p.de, p.ate, local);
  const sa = calcStats(p.ant.de, p.ant.ate, local);
  const ok = filtroBase(local);
  const atrasadas = S.tarefas.filter((t) => !isDone(t) && !t.arquivado && ok(t) && t.data < p.ate && t.data < hoje())
    .sort((a, b) => a.data.localeCompare(b.data));
  const evolucao = (tipo === 'ano' || tipo === 'trimestre') ? porMes(p.ate, tipo === 'ano' ? 12 : 3, local) : porDia(p.de, p.ate, local, st.feitas, st.pend);
  const mapa = {};
  st.feitas.forEach((t) => { const d = doneDate(t); mapa[d] = (mapa[d] || 0) + 1; });
  const dias = new Set(st.feitas.map(doneDate)).size;
  const destaques = st.altas.slice().sort((a, b) => doneDate(a).localeCompare(doneDate(b)));
  const diario = S.diario.filter((d) => noPeriodo(d.data, p.de, p.ate)).sort((a, b) => a.data.localeCompare(b.data));
  return { p, local: local || '', st, sa, atrasadas, evolucao, mapa, dias, destaques, diario, gerado: new Date(),
    v: { feitas: variacao(st.feitas.length, sa.feitas.length), pend: variacao(st.pend.length, sa.pend.length), taxa: Math.round((st.taxa - sa.taxa) * 100) } };
}

/* ---------- peças do relatório ---------- */
const TIPO_REL = { dia: 'Diário', semana: 'Semanal', mes: 'Mensal', trimestre: 'Trimestral', ano: 'Anual', livre: '' };
const pctBR = (x) => NF.format(Math.round(x * 1000) / 10) + '%';
const listaPt = (a) => (a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]);
const RANK_PRIO = { Alta: 0, 'Média': 1, Baixa: 2 };

/* Texto de "resultado" da atividade, sem as marcações que a importação dos relatórios acrescenta. */
function resultadoDe(t) {
  return String(t.descricao || '').split('\n')
    .filter((l) => !/^(Situação no relatório:|Importada do )/.test(l.trim()))
    .join(' ').replace(/^\[[^\]]*\]\s*/, '').replace(/\s+/g, ' ').trim();
}

function pillDe(t) {
  if (isDone(t)) { return '<span class="pill p-ok">FINALIZADO</span>'; }
  if (t.status === 'Em andamento') { return '<span class="pill p-info">EM ANDAMENTO</span>'; }
  return t.prioridade === 'Alta' ? '<span class="pill p-bad">PENDENTE</span>' : '<span class="pill p-warn">EM ABERTO</span>';
}

/* Ocorrências que se repetem: o mesmo título (sem números) duas vezes ou mais, ou marcado como recorrente. */
function recorrenciasDe(lista) {
  const grupos = new Map();
  lista.forEach((t) => {
    const k = norm(t.titulo).replace(/\(.*?\)|\d+[ºª°]?|[^a-z ]/g, ' ').split(/\s+/).filter((w) => w.length > 2).slice(0, 4).join(' ');
    if (!k) { return; }
    const g = grupos.get(k) || []; g.push(t); grupos.set(k, g);
  });
  const rep = Array.from(grupos.values()).filter((g) => g.length > 1).map((g) => ({ titulo: g[0].titulo, n: g.length }));
  lista.filter((t) => /recorren|reincid/.test(norm(t.titulo))).forEach((t) => { if (!rep.some((r) => r.titulo === t.titulo)) { rep.push({ titulo: t.titulo, n: 0 }); } });
  return rep.sort((a, b) => b.n - a.n);
}

function buildRelatorio(m, opc) {
  opc = opc || {};
  const cfg = S.config, st = m.st, ant = m.sa, p = m.p;
  const acento = ACENTO_MES[parseInt(p.de.slice(5, 7), 10) - 1];
  const periodoTxt = p.tipo === 'mes' ? cap(mesLongo(p.de)) + ' ' + p.de.slice(0, 4) : p.rotulo;
  const tipoNome = TIPO_REL[p.tipo];
  const titulo = 'Relatório ' + (tipoNome ? tipoNome + ' ' : '') + 'de TI — ' + periodoTxt + (cfg.empresa ? ' — ' + cfg.empresa : '');

  const regs = st.feitas.concat(st.pend);
  const total = regs.length, nF = st.feitas.length, nA = st.pend.length;
  const andamento = st.pend.filter((t) => t.status === 'Em andamento').length;
  const altas = regs.filter((t) => t.prioridade === 'Alta');
  const altasAbertas = altas.filter((t) => !isDone(t));
  const cats = st.porCat;
  const totAnt = ant.feitas.length + ant.pend.length;
  const tf = Math.round((st.taxa - ant.taxa) * 100);
  const rec = recorrenciasDe(regs);
  const acomp = regs.filter((t) => t.categoria === 'Acompanhamento');
  /* Plano de ação: primeiro o que ficou aberto neste período; depois atrasos anteriores, dos mais recentes aos mais antigos. */
  const porPrio = (a, b) => RANK_PRIO[a.prioridade] - RANK_PRIO[b.prioridade];
  const idsPend = new Set(st.pend.map((t) => t.id));
  const abertasCiclo = st.pend.slice().sort((a, b) => porPrio(a, b) || a.data.localeCompare(b.data))
    .concat(m.atrasadas.filter((t) => !idsPend.has(t.id)).sort((a, b) => porPrio(a, b) || b.data.localeCompare(a.data)));
  const resumos = m.diario.filter((d) => /^Resumo executivo/i.test(d.texto));
  const notas = m.diario.filter((d) => !/^Resumo executivo/i.test(d.texto));
  const limite = opc.detalhado ? Infinity : 15;
  const sec = (n, nome, corpo) => `<div class="section"><span class="sec-num">Seção ${pad(n)}</span><h2 class="sec-title">${nome}</h2>${corpo}</div>`;
  const tabela = (cab, linhas) => `<div class="table-wrap"><table><thead><tr>${cab.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table></div>`;
  const vazio = (txt) => `<p class="vazio">${txt}</p>`;
  const paragrafos = (txt) => String(txt).split(/\n\s*\n/).map((x) => `<p>${esc(x.trim()).replace(/\n/g, '<br>')}</p>`).join('');

  /* capa */
  const meta = [['Período', `${fmtBR(p.de)} a ${fmtBR(p.ate)}`, 'cp'], ['Registros de atividade', total, 'cp'], ['Finalizados', `${nF} (${pctBR(st.taxa)})`, 'cg'],
    ['Em aberto', nA + (andamento ? ` · ${andamento} em andamento` : ''), 'cy'], ['Prioridade alta', `${altas.length} (${altasAbertas.length} em aberto)`, 'cr']]
    .concat(m.local ? [['Local', esc(m.local), 'cb']] : [])
    .concat([['Responsável', esc([cfg.cargo, cfg.responsavel].filter(Boolean).join(' — ') || '—'), '']]);
  const kpiItem = (v, rot, c) => `<div class="kpi-item"><span class="kv ${c}">${v}</span><span class="kl">${rot}</span></div>`;
  const capa = `<div class="cover"><div class="cover-top"><div><div class="badge-row"><span class="badge b1">Departamento de Tecnologia da Informação</span>` +
    (cats.length ? `<span class="badge b2">${esc(cats.slice(0, 3).map((c) => c.nome).join(' · '))}</span>` : '') + '<span class="badge b3">Uso Corporativo Interno</span></div>' +
    `<h1 class="cover-title">Relatório ${tipoNome ? esc(tipoNome) + ' ' : ''}de <span>TI</span><br>${esc(periodoTxt)}</h1>` +
    `<p class="cover-subtitle">${esc(cats.slice(0, 5).map((c) => c.nome).concat(cfg.empresa ? [cfg.empresa] : []).join(' · '))}</p></div>` +
    `<div class="meta-block">${meta.map((r) => `<div class="meta-row"><span class="mk">${r[0]}</span><span class="mv ${r[2]}">${r[1]}</span></div>`).join('')}</div></div>` +
    '<div class="kpi-strip">' + kpiItem(total, 'Registros no período', 'cp') + kpiItem(pctBR(st.taxa), 'Com status finalizado', 'cg') +
    kpiItem(nA, 'Em aberto', 'cy') + kpiItem(altas.length, 'Prioridade alta', 'cr') +
    (cats[0] ? kpiItem(cats[0].a + cats[0].b, esc(cats[0].nome), 'cb') : kpiItem(m.dias, 'Dias com atividade', 'cb')) +
    (cats[1] ? kpiItem(cats[1].a + cats[1].b, esc(cats[1].nome), 'cv') : kpiItem(st.horas ? num(st.horas) + ' h' : m.dias, st.horas ? 'Horas registradas' : 'Dias com atividade', 'cv')) +
    '</div></div>';

  /* 01 resumo executivo */
  const destaquesAbertos = abertasCiclo.slice(0, 3).map((t) => esc(t.titulo));
  const auto = `No período foram registradas <strong>${total} atividades</strong>, das quais <strong>${nF} constam como finalizadas (${pctBR(st.taxa)})</strong>. ` +
    (cats.length ? `As frentes com mais registros foram ${listaPt(cats.slice(0, 3).map((c) => `<strong>${esc(c.nome)}</strong> (${c.a + c.b})`))}. ` : '') +
    (altas.length ? `Houve ${altas.length} registro${altas.length > 1 ? 's' : ''} de prioridade alta, ${altas.length - altasAbertas.length} já resolvido${altas.length - altasAbertas.length === 1 ? '' : 's'}. ` : '') +
    (nA ? `Permanecem em aberto <strong>${nA} registro${nA > 1 ? 's' : ''}</strong>${andamento ? ` (${andamento} em andamento)` : ''}${destaquesAbertos.length ? ', com destaque para ' + listaPt(destaquesAbertos) : ''}.` : 'Não há registros em aberto no período.') +
    (totAnt ? ` Em relação ao período anterior, o volume de registros variou ${variacao(total, totAnt).txt} e a taxa de finalização ${(tf > 0 ? '+' : '') + tf} pp.` : '');
  const s1 = resumos.length
    ? resumos.map((d) => `<div class="exec-box">${paragrafos(d.texto.replace(/^Resumo executivo[^\n]*\n+/i, ''))}</div>`).join('') + `<p>${auto}</p>`
    : `<div class="exec-box">${auto}</div>`;

  /* 02 visão geral */
  const s2 = cats.length ? '<div class="cg2">' + cats.slice(0, 6).map((c) => {
    const exemplos = regs.filter((t) => t.categoria === c.nome).slice(0, 3).map((t) => esc(t.titulo));
    return `<div class="card" style="--c:${c.cor}"><div class="card-label">${esc(c.nome)}</div><div class="card-title">${c.a + c.b} registro${c.a + c.b > 1 ? 's' : ''} · ${c.a} finalizado${c.a === 1 ? '' : 's'}${c.b ? ` · ${c.b} em aberto` : ''}</div><div class="card-body">${exemplos.join('; ')}.</div></div>`;
  }).join('') + '</div>' : vazio('Sem atividades no período.');

  /* 03 atividades */
  const s3 = cats.length ? cats.map((c, i) => {
    const lista = regs.filter((t) => t.categoria === c.nome).sort((a, b) => doneDate(a).localeCompare(doneDate(b)));
    const mostrar = lista.slice(0, limite), resto = lista.length - mostrar.length;
    const linhas = mostrar.map((t) => `<tr><td class="tn">${esc(t.titulo)}<span class="dt">${fmtBR(isDone(t) ? doneDate(t) : t.data)}${t.prioridade === 'Alta' ? ' · prioridade alta' : ''}</span></td><td>${esc(resultadoDe(t)) || '—'}</td><td>${esc(t.local)}</td><td>${pillDe(t)}</td></tr>`).join('') +
      (resto > 0 ? `<tr><td colspan="4" class="vazio">e mais ${resto} registros. Marque "Lista completa" para ver todos.</td></tr>` : '');
    return `<div class="cat-title">3.${i + 1} ${esc(c.nome)} — ${lista.length} registro${lista.length > 1 ? 's' : ''}</div>` + tabela(['Atividade', 'Resultado', 'Local', 'Status'], linhas);
  }).join('') : vazio('Sem atividades no período.');

  /* 04 incidentes */
  const s4 = altas.length
    ? '<p>Registros de prioridade alta do período: falhas, quedas e ocorrências que afetaram a operação.</p>' +
      tabela(['#', 'Incidente', 'Categoria', 'Local', 'Ação aplicada', 'Status'], altas.map((t, i) => `<tr><td>${pad(i + 1)}</td><td class="tn">${esc(t.titulo)}<span class="dt">${fmtBR(t.data)}</span></td><td>${chipCat(t.categoria)}</td><td>${esc(t.local)}</td><td>${esc(resultadoDe(t)) || '—'}</td><td>${isDone(t) ? '<span class="pill p-ok">RESOLVIDO</span>' : pillDe(t)}</td></tr>`).join(''))
    : vazio('Nenhum registro de prioridade alta no período.');

  /* 05 indicadores */
  const vt = variacao(total, totAnt);
  const linhasKpi = [
    ['Registros de atividade', total, 'cp', totAnt ? `${vt.txt} em relação ao período anterior (${totAnt}).` : 'Sem período anterior para comparar.'],
    ['Taxa de registros finalizados', `${nF} de ${total} (${pctBR(st.taxa)})`, 'cg', totAnt ? `${(tf > 0 ? '+' : '') + tf} pp em relação ao período anterior.` : '—'],

  const maxCat = cats.length ? cats[0].a + cats[0].b : 1;
  const dist = cats.length ? '<p style="margin-top:16px">Distribuição das atividades por categoria:</p><div class="dist">' + cats.slice(0, 12).map((c) =>
    `<div class="dist-row"><span class="dist-name" title="${esc(c.nome)}">${esc(c.nome)}</span><div class="dist-bg"><div class="dist-fill" style="width:${((c.a + c.b) / maxCat) * 100}%;background:${c.cor}"></div></div><span class="dist-val">${c.a + c.b} · ${pctBR((c.a + c.b) / total)}</span></div>`).join('') + '</div>' : '';
  const s5 = tabela(['Indicador', 'Valor', 'Análise'], linhasKpi.map((r) => `<tr><td class="tn">${r[0]}</td><td class="${r[2]}">${r[1]}</td><td>${r[3]}</td></tr>`).join('')) + dist +

    `<div><div class="sub" style="margin-top:0">Por prioridade</div>${barrasHTML(st.prios)}<p class="leg">Cor clara: em aberto.</p></div></div>`;

  /* 06 análise técnica */

  const nivel = st.taxa >= 0.9 ? 'alta taxa de finalização' : st.taxa >= 0.75 ? 'boa taxa de finalização' : 'taxa de finalização baixa, com acúmulo de pendências';
  const comPend = cats.filter((c) => c.b > 0).slice(0, 4);
  const s6 = (total ? `<div class="exec-box blue">O período apresentou <strong>${nivel}</strong> (${pctBR(st.taxa)}). ` +

    (rec.length ? `<p><strong>Recorrências.</strong> ${listaPt(rec.slice(0, 4).map((r) => esc(r.titulo) + (r.n > 1 ? ` (${r.n}×)` : '')))} se repetiram no período, o que sugere causa raiz ainda não tratada.</p>` : '') +

  /* 07 melhorias */
  const melhorias = st.feitas.filter((t) => /\b(instal|implant|configur|cria|novo|nova|atualiz|migra|troca|substitu|upgrade|integra|ativa|organiz)/.test(norm(t.titulo)))

  const s7 = melhorias.length

  if (m.atrasadas.length) { riscos.push(['r-medio', 'RISCO MÉDIO', `${m.atrasadas.length} pendência${m.atrasadas.length > 1 ? 's' : ''} em atraso`, 'Mais antigas: ' + listaPt(m.atrasadas.slice(0, 3).map((t) => `${esc(t.titulo)} (${fmtDM(t.data)})`)) + '.']); }
  if (rec.length) { riscos.push(['r-medio', 'RISCO MÉDIO', 'Ocorrências recorrentes', listaPt(rec.slice(0, 3).map((r) => esc(r.titulo))) + ' voltaram a aparecer; correções pontuais não eliminaram a causa.']); }
  if (acomp.some((t) => !isDone(t))) { riscos.push(['r-medio', 'RISCO MÉDIO', 'Dependência de terceiros', 'Há acompanhamentos de operadoras ou fornecedores ainda em aberto, com prazo fora do controle da TI.']); }
  if (!riscos.length) { riscos.push(['r-baixo', 'RISCO BAIXO', 'Sem riscos críticos em aberto', 'Nenhuma pendência de prioridade alta, atraso ou recorrência identificada nos registros do período.']); }
  const s8 = '<div class="risk-grid">' + riscos.slice(0, 6).map((r) => `<div class="risk-card"><span class="rl ${r[0]}">${r[1]}</span><h4>${r[2]}</h4><p>${r[3]}</p></div>`).join('') + '</div>';

  /* 09 recomendações */
  const recs = altasAbertas.slice(0, 3).map((t) => `<strong>Resolver ${esc(t.titulo)}:</strong> pendência de prioridade alta em ${esc(t.categoria)} (${esc(t.local)}).`);
  if (comPend[0] && comPend[0].b > 1) { recs.push(`<strong>Priorizar ${esc(comPend[0].nome)}:</strong> categoria com ${comPend[0].b} registros em aberto no período.`); }

  if (acomp.some((t) => !isDone(t))) { recs.push('<strong>Cobrar prazos dos terceiros:</strong> registrar a data prometida por operadoras e fornecedores nos acompanhamentos em aberto.'); }
  if (!recs.length) { recs.push('<strong>Manter a rotina atual</strong> de registro e acompanhamento das atividades.'); }
  const s9 = '<ul class="rec">' + recs.map((r) => `<li>${r}</li>`).join('') + '</ul>';

  /* 10 plano de ação */
  const s10 = abertasCiclo.length ? abertasCiclo.slice(0, 10).map((t, i) => {

  }).join('') + (abertasCiclo.length > 10 ? `<p class="leg">e mais ${abertasCiclo.length - 10} pendências na tela Tarefas.</p>` : '') : vazio('Nenhuma pendência para o próximo ciclo.');

  /* 11 conclusão */
  const s11 = `<div class="exec-box green">${esc(periodoTxt)} encerra com <strong>${nF} atividade${nF === 1 ? '' : 's'} finalizada${nF === 1 ? '' : 's'}</strong> (${pctBR(st.taxa)} dos registros)` +
    (cats.length ? `, com maior atuação em ${listaPt(cats.slice(0, 2).map((c) => `<strong>${esc(c.nome)}</strong>`))}` : '') + `, e ${nA ? `<strong>${nA} registro${nA > 1 ? 's' : ''} em aberto</strong>` : '<strong>nenhum registro em aberto</strong>'}.</div>` +
    (abertasCiclo.length ? `<p>Para o próximo ciclo, a prioridade é ${listaPt(abertasCiclo.slice(0, 3).map((t) => esc(t.titulo)))}.</p>` : '');

  const quando = m.gerado.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  const docId = 'DOC-TI-' + (p.tipo === 'mes' ? MES_CURTO[parseInt(p.de.slice(5, 7), 10) - 1].toUpperCase() + '-' + p.de.slice(0, 4) : p.tipo.toUpperCase() + '-' + p.de.replace(/-/g, ''));
  const fora = (cfg.foraDosRelatorios || []).length ? ' Não contam: ' + esc(cfg.foraDosRelatorios.join(', ')) + '.' : '';
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">` +
    `<title>${esc(titulo)}</title><link rel="stylesheet" href="${FONTES_RELATORIO}"><style>${cssRelatorio(acento)}</style></head><body>` + capa +
    '<div class="container">' +
    sec(1, 'Resumo Executivo', s1) + sec(2, 'Visão Geral do Ambiente', s2) + sec(3, 'Atividades Realizadas', s3) +
    sec(4, 'Incidentes e Problemas Identificados', s4) + sec(5, 'Indicadores e KPIs', s5) + sec(6, 'Análise Técnica do Ambiente', s6) +
    sec(7, 'Melhorias Implementadas', s7) + sec(8, 'Riscos e Pontos de Atenção', s8) + sec(9, 'Recomendações Técnicas', s9) +
    sec(10, 'Plano de Ação', s10) + sec(11, 'Conclusão', s11) + '</div>' +

    `<div class="doc-id">${esc(docId)} · CONFIDENCIAL</div></div></body></html>`;
}

/* Texto pronto para colar em e-mail ou mensagem */
function resumoTexto(m) {
  const st = m.st, L = [];
  L.push((m.p.tipo === 'dia' ? 'Resumo do dia — ' : 'Resumo — ') + m.p.rotulo + (m.local ? ' (' + m.local + ')' : ''));
  L.push('');
  L.push(`Concluídas: ${st.feitas.length} | Pendentes: ${st.pend.length} | Taxa: ${pct(st.taxa)}` + (st.horas ? ` | Horas: ${num(st.horas)}` : ''));
  if (st.porCat.length) {
    L.push('');
    L.push('Principais categorias:');
    st.porCat.slice(0, 5).forEach((c) => L.push(`- ${c.nome}: ${c.a}${c.b ? ' (+' + c.b + ' pendentes)' : ''}`));
  }
  const feitas = st.feitas.slice().sort((a, b) => doneDate(a).localeCompare(doneDate(b)));
  if (feitas.length) {
    L.push('');
    L.push(m.p.tipo === 'dia' ? 'Realizado:' : 'Destaques:');
    (m.p.tipo === 'dia' ? feitas : (m.destaques.length ? m.destaques : feitas)).slice(0, 15).forEach((t) => L.push(`- ${m.p.tipo === 'dia' ? '' : fmtDM(doneDate(t)) + ' '}${t.titulo}`));
  }
  if (st.pend.length) {
    L.push('');
    L.push('Pendente:');
    st.pend.slice(0, 10).forEach((t) => L.push(`- ${t.titulo}${t.prioridade === 'Alta' ? ' (alta)' : ''}`));
  }
  m.diario.forEach((d) => { L.push(''); L.push(`Observações de ${fmtDM(d.data)}: ${d.texto}`); });
  return L.join('\n');
}

/* CSV para Excel (separador ";", UTF-8 com BOM). Evita fórmulas em células de texto. */
function celulaCsv(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) { s = "'" + s; }
  return '"' + s.replace(/"/g, '""') + '"';
}
function csvTarefas(lista) {
  const cab = ['Data', 'Concluída em', 'Atividade', 'Status', 'Prioridade', 'Local', 'Categoria', 'Horas', 'Descrição'];
  const linhas = lista.slice().sort((a, b) => a.data.localeCompare(b.data)).map((t) =>
    [fmtBR(t.data), fmtBR(t.concluidaEm), t.titulo, t.status, t.prioridade, t.local, t.categoria, t.horas === '' ? '' : String(t.horas).replace('.', ','), t.descricao].map(celulaCsv).join(';'));
  return '﻿' + [cab.map(celulaCsv).join(';')].concat(linhas).join('\r\n');
}


/* ===== estado, API e armazenamento ===== */
const STATUS_LISTA = ['A fazer', 'Em andamento', 'Concluído'];
const PRIORIDADES_LISTA = ['Alta', 'Média', 'Baixa'];
const CATEGORIAS_PADRAO = ['CFTV e Acesso', 'Rede', 'Backup', 'Relatório', 'Chamado', 'Servidores e Sistemas', 'Impressoras', 'Som e Telões',
  'Estacionamento e Pagamentos', 'Equipamentos e Usuários', 'Infraestrutura', 'Acompanhamento', 'Documentação', 'Desenvolvimento',
  'Administrativo', 'Reuniões e Treinamentos', 'Folga / Férias', 'Outros'];

function configPadrao() {
  return {
    status: STATUS_LISTA.slice(), prioridades: PRIORIDADES_LISTA.slice(), locais: ['Shopping', 'Corporate', 'WS PARK', 'Outro'],
    categorias: CATEGORIAS_PADRAO.slice(), foraDosRelatorios: [CAT_FOLGA], empresa: 'Caruaru Shopping', responsavel: '', cargo: 'Tecnologia da Informação'
  };
}

const S = {
  cfg: Object.assign({ apiUrl: '', token: '' }, lsGet('pti.cfg', {})),
  config: configPadrao(), tarefas: [], diario: [], carregado: false, modo: 'local', sync: { estado: 'busy', msg: '' },
  gravando: 0 /* gravações em andamento; enquanto > 0 não recarregamos do servidor */
};

const isDone = (t) => t.status === 'Concluído';
const doneDate = (t) => t.concluidaEm || t.data;
const noPeriodo = (d, de, ate) => d >= de && d <= ate;
const isAtrasada = (t, ref) => !isDone(t) && !t.arquivado && t.data < (ref || hoje());
const porId = (id) => S.tarefas.find((t) => t.id === id);

/* Marcações sim/não (arquivado, revisar). A planilha pode devolver 1, "1", TRUE, "FALSE", 0 ou vazio:
   "FALSE" e "0" são textos não vazios e passariam como verdadeiros num teste simples. */
const ehSim = (v) => v === true || v === 1 || /^(1|true|sim|verdadeiro|x)$/i.test(String(v == null ? '' : v).trim());
const normMarcas = (t) => Object.assign({}, t, { arquivado: ehSim(t.arquivado) ? '1' : '', revisar: ehSim(t.revisar) ? '1' : '' });

function normTask(t) {
  const agora = new Date().toISOString();
  const titulo = String(t.titulo || '').trim().slice(0, 1000);
  if (!titulo) { throw new Error('Toda tarefa precisa de um título.'); }
  const status = STATUS_LISTA.indexOf(t.status) >= 0 ? t.status : 'A fazer';
  const data = /^\d{4}-\d{2}-\d{2}$/.test(t.data || '') ? t.data : hoje();
  const horas = parseFloat(t.horas);
  return {
    id: t.id || uid(), titulo, descricao: String(t.descricao || '').slice(0, 5000), status,
    prioridade: PRIORIDADES_LISTA.indexOf(t.prioridade) >= 0 ? t.prioridade : 'Média',
    local: String(t.local || '').trim().slice(0, 60) || 'Shopping',
    categoria: String(t.categoria || '').trim().slice(0, 60) || CATEGORIA_PADRAO,
    data, concluidaEm: status === 'Concluído' ? (/^\d{4}-\d{2}-\d{2}$/.test(t.concluidaEm || '') ? t.concluidaEm : data) : '',
    horas: (isNaN(horas) || horas < 0 || horas > 999) ? '' : horas,
    arquivado: ehSim(t.arquivado) ? '1' : '', revisar: ehSim(t.revisar) ? '1' : '', origem: t.origem || 'app', notionId: t.notionId || '',
    criadoEm: t.criadoEm || agora, atualizadoEm: agora
  };
}

/* ---------- "servidor" local (modo sem planilha) ---------- */
function lerLocal() { return lsGet('pti.local', { tarefas: [], diario: [], config: {} }); }
function gravarLocal(d) {
  if (!lsSet('pti.local', d)) { throw new Error('O navegador não deixou gravar. O armazenamento está cheio ou bloqueado.'); }
}
async function chamarLocal(acao, p) {
  const d = lerLocal();
  switch (acao) {
    case 'all': return { config: Object.assign(configPadrao(), d.config), tarefas: d.tarefas, diario: d.diario };
    case 'saveTasks': {
      const mapa = new Map(d.tarefas.map((t, i) => [t.id, i]));
      p.tarefas.forEach((t) => { if (mapa.has(t.id)) { d.tarefas[mapa.get(t.id)] = t; } else { d.tarefas.push(t); } });
      gravarLocal(d); return { tarefas: p.tarefas };
    }
    case 'deleteTasks': {
      const del = new Set(p.ids); const antes = d.tarefas.length;
      d.tarefas = d.tarefas.filter((t) => !del.has(t.id)); gravarLocal(d); return { removidas: antes - d.tarefas.length };
    }
    case 'saveDiary': {
      const e = p.entrada; d.diario = d.diario.filter((x) => x.id !== e.id);
      if (String(e.texto || '').trim()) { d.diario.push(e); }
      gravarLocal(d); return { entrada: e };
    }
    case 'saveConfig': { d.config = Object.assign(d.config || {}, p.config); gravarLocal(d); return { config: Object.assign(configPadrao(), d.config) }; }
    case 'importNotion': throw new Error('A importação do Notion só funciona com a planilha conectada (Ajustes → Conexão).');
    default: throw new Error('Ação desconhecida: ' + acao);
  }
}

async function chamarApi(acao, payload) {
  if (!S.cfg.apiUrl || !S.cfg.token) { return chamarLocal(acao, payload); }
  let r;
  try {
    r = await fetch(S.cfg.apiUrl, { method: 'POST', body: JSON.stringify({ token: S.cfg.token, action: acao, payload: payload || {} }), redirect: 'follow' });
  } catch (e) { throw new Error('Sem conexão com a planilha. Verifique a internet e a URL em Ajustes.'); }
  if (!r.ok) { throw new Error('A planilha respondeu com erro ' + r.status + '.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Resposta inesperada. Confira se a URL termina em /exec e se o acesso da implantação é "Qualquer pessoa".'); }
  if (!j.ok) { throw new Error(j.error || 'Erro no servidor.'); }
  return j.data;
}

function setSync(estado, msg) {
  S.sync = { estado, msg: msg || '' };
  const el = $('#sync');
  if (!el) { return; }
  const rot = { ok: 'Planilha sincronizada', busy: 'Sincronizando…', erro: 'Sem sincronizar', local: 'Só neste navegador' }[estado];
  el.className = 'sync ' + estado;
  el.title = msg || '';
  el.innerHTML = `<i></i><span>${esc(rot)}</span>`;
}

function aplicarDados(d) {
  S.config = Object.assign(configPadrao(), d.config || {});
  S.tarefas = (d.tarefas || []).map(normMarcas);
  S.diario = d.diario || [];
  S.carregado = true;
}
function gravarCache() {
  if (S.modo !== 'remoto') { return; }
  const ok = lsSet('pti.cache', { url: S.cfg.apiUrl, config: S.config, tarefas: S.tarefas, diario: S.diario });
  if (!ok) { lsDel('pti.cache'); }
}

async function carregar() {
  S.modo = (S.cfg.apiUrl && S.cfg.token) ? 'remoto' : 'local';
  if (S.modo === 'local') {
    aplicarDados(await chamarLocal('all')); setSync('local', 'Os dados ficam neste navegador. Conecte a planilha em Ajustes para sincronizar.');
    return;
  }
  const cache = lsGet('pti.cache', null);
  if (cache && cache.url === S.cfg.apiUrl && !S.carregado) { aplicarDados(cache); renderTudo(); }
  setSync('busy');
  try {
    aplicarDados(await chamarApi('all'));
    gravarCache(); setSync('ok', 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    setSync('erro', e.message); toast(e.message, 'erro');
    if (!S.carregado) { aplicarDados({ config: configPadrao(), tarefas: [], diario: [] }); }
  }
}

/* ---------- escrita otimista ---------- */
function mesclarLocalmente(lista) {
  const mapa = new Map(S.tarefas.map((t, i) => [t.id, i]));
  lista.map(normMarcas).forEach((t) => { if (mapa.has(t.id)) { S.tarefas[mapa.get(t.id)] = t; } else { S.tarefas.push(t); mapa.set(t.id, S.tarefas.length - 1); } });
}

async function salvarTarefas(lista) {
  const prontas = lista.map(normTask);
  mesclarLocalmente(prontas);
  renderTudo();
  setSync('busy');
  S.gravando++;
  try {
    for (let i = 0; i < prontas.length; i += 400) {
      const r = await chamarApi('saveTasks', { tarefas: prontas.slice(i, i + 400) });
      mesclarLocalmente(r.tarefas);
    }
    gravarCache(); setSync(S.modo === 'remoto' ? 'ok' : 'local');
  } catch (e) {
    toast('Não foi possível salvar: ' + e.message, 'erro'); setSync('erro', e.message);
    await carregar(); renderTudo();
  } finally { S.gravando--; }
  return prontas;
}

async function excluirTarefas(ids) {
  const del = new Set(ids);
  S.tarefas = S.tarefas.filter((t) => !del.has(t.id));
  renderTudo(); setSync('busy');
  S.gravando++;
  try {
    for (let i = 0; i < ids.length; i += 400) { await chamarApi('deleteTasks', { ids: ids.slice(i, i + 400) }); }
    gravarCache(); setSync(S.modo === 'remoto' ? 'ok' : 'local');
  } catch (e) { toast('Não foi possível excluir: ' + e.message, 'erro'); await carregar(); renderTudo(); }
  finally { S.gravando--; }
}

async function salvarDiario(data, texto) {
  const id = 'd-' + data, agora = new Date().toISOString();
  S.diario = S.diario.filter((x) => x.id !== id);
  if (texto.trim()) { S.diario.push({ id, data, texto, criadoEm: agora, atualizadoEm: agora }); }
  S.gravando++;
  try { await chamarApi('saveDiary', { entrada: { id, data, texto } }); gravarCache(); setSync(S.modo === 'remoto' ? 'ok' : 'local'); } catch (e) { toast('Não foi possível salvar o resumo do dia: ' + e.message, 'erro'); }
  finally { S.gravando--; }
}

async function salvarConfig(parcial) {
  const r = await chamarApi('saveConfig', { config: parcial });
  S.config = Object.assign(configPadrao(), r.config);
  gravarCache();
  return S.config;
}

/* ---------- estatísticas ---------- */
function filtroBase(local) {
  const fora = new Set(S.config.foraDosRelatorios || []);
  return (t) => (!local || t.local === local) && !fora.has(t.categoria);
}

function agrupar(lista, chave) {
  const m = new Map();
  lista.forEach((t) => { const k = t[chave] || '—'; m.set(k, (m.get(k) || 0) + 1); });
  return m;
}

function calcStats(de, ate, local) {
  const ok = filtroBase(local);
  const feitas = S.tarefas.filter((t) => isDone(t) && ok(t) && noPeriodo(doneDate(t), de, ate));
  const pend = S.tarefas.filter((t) => !isDone(t) && ok(t) && noPeriodo(t.data, de, ate));
  const total = feitas.length + pend.length;
  const cats = new Map();
  feitas.forEach((t) => { const c = cats.get(t.categoria) || { nome: t.categoria, a: 0, b: 0 }; c.a++; cats.set(t.categoria, c); });
  pend.forEach((t) => { const c = cats.get(t.categoria) || { nome: t.categoria, a: 0, b: 0 }; c.b++; cats.set(t.categoria, c); });
  const porCat = Array.from(cats.values()).sort((x, y) => (y.a + y.b) - (x.a + x.b)).map((c) => Object.assign(c, { cor: corCategoria(c.nome) }));
  const locais = new Map();
  feitas.forEach((t) => locais.set(t.local, (locais.get(t.local) || 0) + 1));
  const porLocal = Array.from(locais.entries()).sort((a, b) => b[1] - a[1]).map(([nome, valor], i) => ({ nome, valor, cor: CORES_CABO[i % CORES_CABO.length] }));
  const prios = ['Alta', 'Média', 'Baixa'].map((p, i) => ({ nome: p, a: feitas.filter((t) => t.prioridade === p).length, b: pend.filter((t) => t.prioridade === p).length, cor: ['#C8372D', '#2A6FBA', '#8593A0'][i] }));
  const horas = feitas.reduce((s, t) => s + (parseFloat(t.horas) || 0), 0);
  return { feitas, pend, total, taxa: total ? feitas.length / total : 0, porCat, porLocal, prios, horas, altas: feitas.filter((t) => t.prioridade === 'Alta') };
}

function porMes(fimRef, n, local) {
  const ok = filtroBase(local), out = [];
  for (let i = n - 1; i >= 0; i--) {
    const ini = addMeses(inicioMes(fimRef), -i), fim = fimMes(ini);
    const a = S.tarefas.filter((t) => isDone(t) && ok(t) && noPeriodo(doneDate(t), ini, fim)).length;
    const b = S.tarefas.filter((t) => !isDone(t) && ok(t) && noPeriodo(t.data, ini, fim)).length;
    out.push({ rot: MES_CURTO[parseInt(ini.slice(5, 7), 10) - 1], a, b, dica: cap(mesLongo(ini)) + ' ' + ini.slice(0, 4) });
  }
  return out;
}

function porDia(de, ate, local, feitasLista, pendLista) {
  const dias = diffDays(ate, de) + 1;
  const out = [];
  if (dias <= 45) {
    for (let i = 0; i < dias; i++) {
      const d = addDays(de, i);
      out.push({ rot: dias <= 8 ? diaCurto(d) : d.slice(8), a: feitasLista.filter((t) => doneDate(t) === d).length, b: pendLista.filter((t) => t.data === d).length, dica: diaCurto(d) + ' ' + fmtBR(d) });
    }
  } else {
    let ini = inicioMes(de);
    while (ini <= ate) {
      const fim = fimMes(ini);
      out.push({ rot: MES_CURTO[parseInt(ini.slice(5, 7), 10) - 1], a: feitasLista.filter((t) => noPeriodo(doneDate(t), ini, fim)).length, b: pendLista.filter((t) => noPeriodo(t.data, ini, fim)).length, dica: cap(mesLongo(ini)) + ' ' + ini.slice(0, 4) });
      ini = addMeses(ini, 1);
    }
  }
  return out;
}

/* ---------- dados de exemplo (para testar sem planilha) ---------- */
function gerarExemplo() {
  let seed = 20261109;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const banco = [
    'Verificar câmera dome do estacionamento', 'Trocar câmera da entrada principal', 'Conferir gravação do DVR da lotérica', 'Reiniciar NVR do almoxarifado', 'Ajustar ângulo da câmera da praça de alimentação',
    'Ronda wi-fi', 'Verificar switch do rack da administração', 'Reconfigurar antena do hotel', 'Atualizar planilha de wi-fi', 'Testar link da operadora',
    'Backup da VM Realiza', 'Conferir backup do Acronis', 'Gerar relatório de checklist', 'Fechar relatório mensal de TI', 'Atender chamado da WPS Sales', 'Verificar O.S. da Claro',
    'Verificar PRTG', 'Atualizar Windows do servidor de arquivos', 'Verificar VPN do financeiro', 'Trocar toner da Ricoh do RH', 'Testar som do mall antes da abertura', 'Telão com placa com defeito',
    'Verificar ATM do estacionamento', 'Conferir pinpad do P3', 'Criar usuário de compras', 'Verificar notebook da brigada', 'Organizar rack do depósito', 'Trocar nobreak das docas',
    'Acompanhamento AST', 'Acompanhamento Neo Net', 'Atualizar diagrama de rede', 'Atualizar Notion', 'Atualizar App RH', 'Fazer dashboard do RH', 'Analisar boletos e NF', 'Reunião Squad BI',
    'Treinamento Group Software', 'Verificar sites do shopping', 'Limpeza do rack da loja', 'Resetar senha da câmera Hikvision pelo SADP'
  ];
  const extras = ['Câmera do estacionamento fora do ar', 'Switch parou no corredor B', 'Rede da administração offline'];
  const tarefas = [], diario = [], base = hoje();
  for (let off = -100; off <= 12; off++) {
    const d = addDays(base, off), wd = parseYmd(d).getDay();
    if (wd === 0 || wd === 6) { continue; }
    const n = 2 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) {
      const raro = rnd() < 0.05;
      const titulo = raro ? pick(extras) : (rnd() < 0.02 ? 'Folga feriado' : pick(banco));
      const passado = off < 0, feita = passado ? rnd() < 0.93 : (off === 0 ? rnd() < 0.5 : false);
      const t = {
        id: uid(), titulo, descricao: '', status: feita ? 'Concluído' : (off === 0 && rnd() < 0.3 ? 'Em andamento' : 'A fazer'),
        prioridade: raro ? 'Alta' : detectarPrioridade(titulo), local: rnd() < 0.8 ? 'Shopping' : pick(['Corporate', 'WS PARK']),
        categoria: classificarCategoria(titulo), data: d, concluidaEm: feita ? d : '', horas: feita && rnd() < 0.5 ? pick([0.5, 1, 1.5, 2, 3]) : '',
        arquivado: '', revisar: '', origem: 'exemplo', notionId: ''
      };
      tarefas.push(normTask(t));
    }
    if (off <= 0 && rnd() < 0.4) { diario.push({ id: 'd-' + d, data: d, texto: pick(['Dia de ronda e manutenção preventiva.', 'Acompanhei a equipe terceirizada e fechei os chamados pendentes.', 'Foco em backup e documentação; sem ocorrências críticas.']), criadoEm: d + 'T12:00:00Z', atualizadoEm: d + 'T12:00:00Z' }); }
  }
  tarefas.push(normTask({ titulo: 'Metas do dia 18 (importada, revisar)', data: addDays(base, -200), status: 'A fazer', arquivado: '1', revisar: '1', origem: 'exemplo' }));
  return { tarefas, diario };
}

/* ---------- Tarefas ---------- */
function filtrarTarefas() {
  const f = U.f, q = norm(f.q).trim();
  const r = S.tarefas.filter((t) => {
    if (f.arq === '' && t.arquivado) { return false; }
    if (f.arq === 'so' && !t.arquivado) { return false; }
    if (f.st === 'abertas' && isDone(t)) { return false; }
    if (f.st === 'concluidas' && !isDone(t)) { return false; }
    if (f.st === 'andamento' && t.status !== 'Em andamento') { return false; }
    if (f.cat && t.categoria !== f.cat) { return false; }
    if (f.local && t.local !== f.local) { return false; }
    if (f.prio && t.prioridade !== f.prio) { return false; }
    if (f.rev && !t.revisar) { return false; }
    if (q && norm(t.titulo + ' ' + t.descricao + ' ' + t.categoria).indexOf(q) < 0) { return false; }
    return true;
  });
  const sinal = f.ordem === 'asc' ? 1 : -1;
  return r.sort((a, b) => sinal * a.data.localeCompare(b.data) || a.titulo.localeCompare(b.titulo));
}

    `<td class="c-sel"><input type="checkbox" data-act="sel" ${U.sel.has(t.id) ? 'checked' : ''} aria-label="Selecionar"></td>` +
    `<td class="n">${fmtBR(t.data)}</td><td class="c-tit"><button class="tt" data-act="editar">${esc(t.titulo)}</button>${t.revisar ? ' <span class="tag-rev">revisar</span>' : ''}${t.arquivado ? ' <span class="tag-arq">arquivada</span>' : ''}</td>` +
    `<td>${chipCat(t.categoria)}</td><td>${chipPrio(t.prioridade) || '<span class="suave">Média</span>'}</td><td>${esc(t.local)}</td>` +
    `<td><button class="est ${t.status === 'Concluído' ? 'ok' : (t.status === 'Em andamento' ? 'and' : '')}" data-act="toggle" title="Clique para alternar">${esc(t.status)}</button></td></tr>`).join('');
  return `<header class="cab"><div><h1>Tarefas</h1><p class="sub">${lista.length} de ${S.tarefas.length} atividades</p></div><button class="pri" data-act="nova">Nova atividade</button></header>` +
    `<section class="painel filtros"><input type="search" id="f-q" value="${esc(f.q)}" placeholder="Buscar por texto…" aria-label="Buscar">` +
    `<select data-f="st" aria-label="Situação">${[['abertas', 'Abertas'], ['andamento', 'Em andamento'], ['concluidas', 'Concluídas'], ['todas', 'Todas']].map((o) => `<option value="${o[0]}"${f.st === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>` +
    `<select data-f="cat" aria-label="Categoria">${optsHTML(catsTodas(), f.cat, 'Todas as categorias')}</select>` +
    `<select data-f="local" aria-label="Local">${optsHTML(locaisTodos(), f.local, 'Todos os locais')}</select>` +
    `<select data-f="prio" aria-label="Prioridade">${optsHTML(S.config.prioridades, f.prio, 'Qualquer prioridade')}</select>` +
    `<select data-f="arq" aria-label="Arquivo">${[['', 'Ativas'], ['so', 'Arquivadas'], ['todas', 'Ativas e arquivadas']].map((o) => `<option value="${o[0]}"${f.arq === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>` +
    (nRev ? `<label class="ck"><input type="checkbox" data-f="rev" ${f.rev ? 'checked' : ''}> A revisar (${nRev})</label>` : '') +
    `<button class="sec" data-act="limpar-filtros">Limpar</button></section>` + bulk +
    (lista.length ? `<section class="painel tab-box"><table class="tab"><thead><tr><th class="c-sel"><input type="checkbox" data-act="sel-todos" aria-label="Selecionar todas" ${selN && selN >= lista.length ? 'checked' : ''}></th>` +
      `<th><button class="th-b" data-act="ordem">Data ${f.ordem === 'asc' ? '↑' : '↓'}</button></th><th>Atividade</th><th>Categoria</th><th>Prioridade</th><th>Local</th><th>Situação</th></tr></thead><tbody>${linhas}</tbody></table>` +
      (lista.length > vis.length ? `<div class="mais"><button class="sec" data-act="mais">Mostrar mais ${Math.min(150, lista.length - vis.length)} (restam ${lista.length - vis.length})</button></div>` : '') + '</section>'
      : '<section class="painel"><p class="vazio">Nenhuma atividade com esses filtros.</p></section>');
}

/* ---------- Painel ---------- */
function seletorPeriodo(estado, tipos, ns) {
  return `<div class="ctl"><div class="seg" role="tablist">${tipos.map((t) => `<button role="tab" aria-selected="${estado.tipo === t}" class="${estado.tipo === t ? 'on' : ''}" data-act="${ns}-tipo" data-v="${t}">${TIPOS_PERIODO[t]}</button>`).join('')}</div>` +
    (estado.tipo !== 'livre' ? navPeriodo(periodoDe(estado.tipo, estado.ref).rotulo, { ant: ns + '-ant', prox: ns + '-prox', hoje: ns + '-hoje' }) : '') +
    `<select data-${ns}="local" aria-label="Local">${optsHTML(locaisTodos(), estado.local, 'Todos os locais')}</select></div>`;
}

function kpiHTML(cls, val, rot, v) {
  return `<div class="kpi ${cls}"><b>${val}</b><span>${rot}</span>${v ? `<em class="${v.cls}">${v.txt}</em>` : ''}</div>`;
}

function viewPainel() {
  const m = montarModelo(U.p.tipo, U.p.ref, U.p.local), st = m.st;
  const tf = Math.round((st.taxa - m.sa.taxa) * 100);
  const mapa = {};
  const ok = filtroBase(U.p.local);
  S.tarefas.forEach((t) => { if (isDone(t) && ok(t)) { const d = doneDate(t); mapa[d] = (mapa[d] || 0) + 1; } });
  return `<header class="cab"><div><h1>Painel</h1><p class="sub">${esc(m.p.rotulo)}. Comparado com o período anterior.</p></div></header>` +
    seletorPeriodo(U.p, ['semana', 'mes', 'trimestre', 'ano'], 'p') +
    `<div class="kpis">${kpiHTML('', st.feitas.length, 'concluídas', m.v.feitas)}${kpiHTML('a', st.pend.length, 'pendentes', m.v.pend)}` +
    `${kpiHTML('v', pct(st.taxa), 'taxa de conclusão', { txt: (tf > 0 ? '+' : '') + tf + ' pp', cls: tf > 0 ? 'sobe' : (tf < 0 ? 'desce' : 'neutro') })}` +
    `${kpiHTML('p', m.dias, 'dias com atividade')}</div>` +
    `<section class="painel"><h2>Evolução no período</h2>${colunasSVG(m.evolucao, { rotulo: 'Concluídas e pendentes' })}<p class="leg">Claro: concluídas. Âmbar: pendentes.</p></section>` +
    `<div class="grade2"><section class="painel"><h2>Por categoria</h2>${barrasHTML(st.porCat.slice(0, 12))}<p class="leg">Cor clara: pendentes.</p></section>` +
    `<section class="painel"><h2>Por local</h2>${rosquinhaHTML(st.porLocal, { centro: 'concluídas', rotulo: 'Concluídas por local' })}<h2 class="h2b">Por prioridade</h2>${barrasHTML(st.prios)}</section></div>` +
    `<section class="painel"><h2>Atividade nos últimos 6 meses</h2>${calorSVG(mapa, hoje(), 26)}</section>` +
    `<section class="painel"><h2>Últimos 12 meses</h2>${colunasSVG(porMes(hoje(), 12, U.p.local), { rotulo: 'Últimos 12 meses' })}</section>` +
    (m.atrasadas.length ? `<section class="painel"><div class="sec-cab"><h2>Pendências em atraso <span class="cont">${m.atrasadas.length}</span></h2><button class="sec" data-act="ver-atrasadas">Ver em Tarefas</button></div>` +
      `<ul class="lista">${m.atrasadas.slice(0, 8).map((t) => linhaTarefa(t, { data: true, ref: hoje() })).join('')}</ul></section>` : '');
}

/* ---------- Diário ---------- */
function viewDiario() {
  const d = U.dd, atual = (S.diario.find((x) => x.data === d) || {}).texto || '';
  const lista = S.diario.slice().sort((a, b) => b.data.localeCompare(a.data)).slice(0, 60);
  return `<header class="cab"><div><h1>Diário</h1><p class="sub">Um registro por dia. Os textos entram nos relatórios do período.</p></div></header>` +
    `<section class="painel"><div class="ctl"><label>Dia <input type="date" id="dd-data" value="${d}"></label></div>` +
    `<textarea id="diario-txt" data-dia="${d}" rows="6" maxlength="5000" placeholder="Ocorrências, decisões, observações do dia.">${esc(atual)}</textarea><span class="dica" id="diario-st"></span></section>` +
    `<section class="painel"><h2>Registros recentes</h2>${lista.length ? '<ul class="dlist">' + lista.map((x) => `<li><button data-act="ir-diario" data-dia="${x.data}"><b>${fmtBR(x.data)}</b> <span class="suave">${diaCurto(x.data)}</span><span class="trecho">${esc(x.texto.slice(0, 160))}</span></button></li>`).join('') + '</ul>' : '<p class="vazio">Nenhum registro ainda.</p>'}</section>`;
}

/* ---------- Relatórios ---------- */
function modeloRel() { const r = U.r; return montarModelo(r.tipo, r.ref, r.local, { de: r.de, ate: r.ate }); }

function viewRelatorios() {
  const r = U.r;
  U.pos = () => { const fr = $('#prev'); if (fr) { fr.srcdoc = buildRelatorio(modeloRel(), { detalhado: r.detalhado }); } };

    seletorPeriodo(r, ['dia', 'semana', 'mes', 'trimestre', 'ano', 'livre'], 'r') + livre +
    `<section class="painel acoes"><label class="ck"><input type="checkbox" id="r-det" ${r.detalhado ? 'checked' : ''}> Lista completa (sem limite de 15 itens por categoria)</label>` +
    `<div class="botoes"><button class="pri" data-act="rel-html">Baixar HTML</button><button class="sec" data-act="rel-pdf">Imprimir ou salvar PDF</button>` +
    `<button class="sec" data-act="rel-csv">Planilha (CSV)</button><button class="sec" data-act="rel-texto">Copiar resumo</button></div></section>` +
    `<iframe id="prev" class="prev" title="Prévia do relatório" sandbox="allow-same-origin allow-modals"></iframe>`;
}

      `Concluídas de anos anteriores vão para o arquivo e o que não foi classificado fica marcado "revisar".</p>` +
      `<label class="campo">Token da integração<input id="a-ntoken" type="password" autocomplete="off" placeholder="ntn_… ou secret_…"></label>` +
      `<label class="campo">ID do banco (opcional)<input id="a-nid" placeholder="ID do banco no Notion (32 caracteres)"></label>` +
      `<div class="botoes"><button class="pri" data-act="importar-notion">Importar agora</button></div><div id="a-nres"></div></section>` : '') +
    `<section class="painel"><h2>Dados</h2><div class="botoes"><button class="sec" data-act="reclassificar">Reclassificar "${esc(CATEGORIA_PADRAO)}"</button>` +
    `<button class="sec" data-act="backup">Baixar backup (JSON)</button><label class="sec arq">Restaurar backup<input type="file" id="a-bkp" accept="application/json,.json" hidden></label>` +
    `<button class="sec" data-act="csv-tudo">Exportar tudo (CSV)</button>` +
    (!remoto ? '<button class="sec" data-act="exemplo">Carregar dados de exemplo</button><button class="sec perigo" data-act="apagar-local">Apagar dados deste navegador</button>' : '') +
    `</div><p class="dica">${n} atividades carregadas. Atalhos: N nova atividade, / buscar, G depois H/S/T/P/D/R/A para trocar de tela.</p></section>`;
