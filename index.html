const VIEWS = { hoje: viewHoje, semana: viewSemana, tarefas: viewTarefas, painel: viewPainel, diario: viewDiario, relatorios: viewRelatorios, ajustes: viewAjustes };


/* ===== roteador, eventos, editor ===== */
const TITULOS = { hoje: 'Hoje', semana: 'Semana', tarefas: 'Tarefas', painel: 'Painel', diario: 'Diário', relatorios: 'Relatórios', ajustes: 'Ajustes' };

function renderTudo() {
  if (!S.carregado) { return; }
  const el = $('#view');
  if (!el) { return; }
  const foco = document.activeElement, idFoco = foco && foco.id, ini = foco && foco.selectionStart, fimSel = foco && foco.selectionEnd;
  const rolagem = el.scrollTop, janela = window.scrollY;
  el.innerHTML = VIEWS[U.view]();
  $$('.nav button').forEach((b) => { const on = b.dataset.view === U.view; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  document.title = TITULOS[U.view] + ' · Planejamento TI';
  if (U.pos) { const f = U.pos; U.pos = null; f(); }
  el.scrollTop = rolagem; window.scrollTo(0, janela);
  if (idFoco && idFoco !== 'qadd') {
    const n = document.getElementById(idFoco);
    if (n) { n.focus(); if (ini != null && n.setSelectionRange && /^(text|search|textarea)$/.test(n.type)) { try { n.setSelectionRange(ini, fimSel); } catch (e) { /* tipo sem seleção */ } } }
  }
  atualizarBadge();
}

/* Selo da aba Tarefas: atividades em aberto (A fazer + Em andamento, fora do arquivo), o mesmo que o filtro "Abertas" mostra.
   Antes ele contava as marcadas "revisar", repetindo o número do "A revisar" e sem mudar ao concluir. */
const contaAbertas = () => S.tarefas.filter((t) => !isDone(t) && !t.arquivado).length;
const contaRevisar = () => S.tarefas.filter((t) => t.revisar && !t.arquivado).length;

function atualizarBadge() {
  const n = contaAbertas();
  const b = $('#badge-tarefas');
  if (b) { b.textContent = n ? String(n) : ''; b.hidden = !n; b.title = n + (n === 1 ? ' atividade em aberto' : ' atividades em aberto'); }
}

function ir(v) {
  U.view = v; U.sel.clear();
  if (location.hash !== '#' + v) { history.replaceState(null, '', '#' + v); }
  renderTudo(); window.scrollTo(0, 0);
}

/* ---------- editor ---------- */
function abrirEditor(id, base) {
  const t = id ? porId(id) : null;
  const v = t || Object.assign({ titulo: '', descricao: '', status: 'A fazer', prioridade: 'Média', local: 'Shopping', categoria: CATEGORIA_PADRAO, data: U.view === 'hoje' ? U.dia : hoje(), horas: '' }, base || {});
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" class="ed" data-form="editor" data-id="${esc(t ? t.id : '')}">` +
    `<h2>${t ? 'Editar atividade' : 'Nova atividade'}</h2>` +
    `<label class="campo">Atividade<input name="titulo" maxlength="1000" required value="${esc(v.titulo)}" autocomplete="off"></label>` +
    `<div class="g3"><label class="campo">Data<input type="date" name="data" required value="${esc(v.data)}"></label>` +
    `<label class="campo">Situação<select name="status">${optsHTML(S.config.status, v.status)}</select></label>` +
    `<label class="campo">Prioridade<select name="prioridade">${optsHTML(S.config.prioridades, v.prioridade)}</select></label></div>` +
    `<div class="g3"><label class="campo">Categoria<select name="categoria">${optsHTML(catsTodas(), v.categoria)}</select></label>` +
    `<label class="campo">Local<select name="local">${optsHTML(locaisTodos(), v.local)}</select></label>` +
    `<label class="campo">Horas (opcional)<input type="number" name="horas" min="0" max="999" step="0.25" value="${esc(v.horas)}"></label></div>` +
    `<label class="campo">Detalhes<textarea name="descricao" rows="3" maxlength="5000">${esc(v.descricao)}</textarea></label>` +
    (t && t.revisar ? '<p class="dica">Esta atividade foi classificada automaticamente. Ao salvar, ela sai da lista "A revisar".</p>' : '') +
    `<div class="botoes">${t ? '<button type="button" class="sec perigo" data-act="ed-excluir">Excluir</button>' : ''}<span class="esp"></span>` +
    `<button type="button" class="sec" data-act="ed-fechar">Cancelar</button><button class="pri" type="submit">Salvar</button></div></form>`;
  dlg.showModal();
  const ti = dlg.querySelector('[name=titulo]');
  if (!t) {
    ti.addEventListener('blur', () => {
      const f = dlg.querySelector('form');
      if (!ti.value.trim() || (base && base.categoria)) { return; }
      if (f.categoria.value === CATEGORIA_PADRAO) { const c = classificarCategoria(ti.value); if (catsTodas().indexOf(c) >= 0) { f.categoria.value = c; } }
      f.prioridade.value = detectarPrioridade(ti.value);
      const l = detectarLocal(ti.value); if (locaisTodos().indexOf(l) >= 0) { f.local.value = l; }
    });
  }
  ti.focus();
}

async function salvarEditor(form) {
  const fd = new FormData(form), id = form.dataset.id, antigo = id ? porId(id) : null;
  const status = fd.get('status');
  const novo = Object.assign({}, antigo || {}, {
    id: id || undefined, titulo: fd.get('titulo'), data: fd.get('data'), status, prioridade: fd.get('prioridade'),
    categoria: fd.get('categoria'), local: fd.get('local'), horas: fd.get('horas'), descricao: fd.get('descricao'), revisar: ''
  });
  if (status === 'Concluído') { if (!antigo || antigo.status !== 'Concluído') { novo.concluidaEm = dataConclusao(); } } else { novo.concluidaEm = ''; }
  $('#dlg').close();
  try { await salvarTarefas([novo]); toast(id ? 'Atividade salva.' : 'Atividade criada.'); } catch (e) { toast(e.message, 'erro'); }
}

/* ---------- ações sobre tarefas ---------- */
/* Data de conclusão: o dia aberto na tela Hoje, ou hoje nas demais telas. Usada em todo lugar que conclui. */
function dataConclusao() { return U.view === 'hoje' ? U.dia : hoje(); }
function alternar(t) {
  const feita = isDone(t);
  /* Concluir é uma revisão: a atividade sai da lista "A revisar". */
  return Object.assign({}, t, feita ? { status: 'A fazer', concluidaEm: '' } : { status: 'Concluído', concluidaEm: dataConclusao(), revisar: '' });
}
async function adicionarRapido(texto, data) {
  const titulo = texto.trim();
  if (!titulo) { return; }
  const cat = classificarCategoria(titulo);
  await salvarTarefas([{
    titulo, data, categoria: catsTodas().indexOf(cat) >= 0 ? cat : CATEGORIA_PADRAO, prioridade: detectarPrioridade(titulo),
    local: (function () { const l = detectarLocal(titulo); return locaisTodos().indexOf(l) >= 0 ? l : 'Shopping'; })(), status: 'A fazer'
  }]);
}

function selecionadas() { return S.tarefas.filter((t) => U.sel.has(t.id)); }

/* ---------- relatório: ações ---------- */
function relatorioAtual() { return modeloRel(); }
function listaDoPeriodo(m) { return m.st.feitas.concat(m.st.pend); }

/* ---------- eventos ---------- */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act],[data-view]');
  if (!el) { return; }
  if (el.dataset.view) { ir(el.dataset.view); return; }
  const act = el.dataset.act, li = el.closest('[data-id]'), id = li && li.dataset.id, t = id ? porId(id) : null;
  switch (act) {
    case 'toggle': if (t) { salvarTarefas([alternar(t)]); } break;
    case 'andamento': if (t) { salvarTarefas([Object.assign({}, t, { status: t.status === 'Em andamento' ? 'A fazer' : 'Em andamento' })]); } break;
    case 'editar': if (t) { abrirEditor(t.id); } break;
    case 'nova': abrirEditor(null); break;
    case 'novo-dia': abrirEditor(null, { data: el.dataset.dia }); break;
    case 'ed-fechar': $('#dlg').close(); break;
    case 'ed-excluir': {
      const fid = el.closest('form').dataset.id;
      if (fid && confirm('Excluir esta atividade? Isso não pode ser desfeito.')) { $('#dlg').close(); excluirTarefas([fid]); toast('Atividade excluída.'); }
      break;
    }
    case 'dia-ant': U.dia = addDays(U.dia, -1); renderTudo(); break;
    case 'dia-prox': U.dia = addDays(U.dia, 1); renderTudo(); break;
    case 'dia-hoje': U.dia = hoje(); renderTudo(); break;
    case 'sem-ant': U.sem = addDays(U.sem, -7); renderTudo(); break;
    case 'sem-prox': U.sem = addDays(U.sem, 7); renderTudo(); break;
    case 'sem-hoje': U.sem = hoje(); renderTudo(); break;
    case 'ir-dia': U.dia = el.dataset.dia; ir('hoje'); break;
    case 'ir-diario': U.dd = el.dataset.dia; renderTudo(); break;
    case 'atrasadas-hoje': {
      const lista = S.tarefas.filter((x) => isAtrasada(x, U.dia)).map((x) => Object.assign({}, x, { data: U.dia }));
      if (lista.length && confirm('Mover ' + lista.length + ' atividades atrasadas para este dia?')) { salvarTarefas(lista); }
      break;
    }
    case 'copiar-dia': { const ok = await copiarTexto(resumoTexto(montarModelo('dia', U.dia, ''))); toast(ok ? 'Resumo do dia copiado.' : 'Não foi possível copiar.', ok ? '' : 'erro'); break; }
    case 'copiar-semana': { const ok = await copiarTexto(resumoTexto(montarModelo('semana', U.sem, ''))); toast(ok ? 'Resumo da semana copiado.' : 'Não foi possível copiar.', ok ? '' : 'erro'); break; }
    case 'rel-semana': U.r.tipo = 'semana'; U.r.ref = U.sem; ir('relatorios'); break;
    case 'ver-atrasadas': U.f = Object.assign(U.f, { st: 'abertas', cat: '', local: U.p.local, prio: '', q: '', rev: false, ordem: 'asc' }); ir('tarefas'); break;
    /* tarefas: filtros e seleção */
    case 'limpar-filtros': U.f = { q: '', st: 'abertas', cat: '', local: '', prio: '', arq: '', rev: false, ordem: 'desc' }; U.lim = 150; renderTudo(); break;
    case 'ordem': U.f.ordem = U.f.ordem === 'asc' ? 'desc' : 'asc'; renderTudo(); break;
    case 'mais': U.lim += 150; renderTudo(); break;
    case 'sel': if (id) { if (el.checked) { U.sel.add(id); } else { U.sel.delete(id); } renderTudo(); } break;
    case 'sel-todos': { const l = filtrarTarefas(); if (el.checked) { l.forEach((x) => U.sel.add(x.id)); } else { U.sel.clear(); } renderTudo(); break; }
    case 'bulk-limpar': U.sel.clear(); renderTudo(); break;
    case 'bulk-concluir': salvarTarefas(selecionadas().filter((x) => !isDone(x)).map((x) => Object.assign({}, x, { status: 'Concluído', concluidaEm: dataConclusao(), revisar: '' }))); U.sel.clear(); break;
    case 'bulk-arquivar': { const l = selecionadas().map((x) => Object.assign({}, x, { arquivado: '1', revisar: '' })); U.sel.clear(); salvarTarefas(l); toast(l.length + ' arquivadas.'); break; }
    case 'bulk-revisada': { const l = selecionadas().map((x) => Object.assign({}, x, { revisar: '' })); U.sel.clear(); salvarTarefas(l); break; }
    case 'bulk-excluir': { const ids = Array.from(U.sel); if (ids.length && confirm('Excluir ' + ids.length + ' atividades? Isso não pode ser desfeito.')) { U.sel.clear(); excluirTarefas(ids); } break; }
    /* painel e relatórios */
    case 'p-tipo': U.p.tipo = el.dataset.v; renderTudo(); break;
    case 'p-ant': U.p.ref = deslocarRef(U.p.tipo, U.p.ref, -1); renderTudo(); break;
    case 'p-prox': U.p.ref = deslocarRef(U.p.tipo, U.p.ref, 1); renderTudo(); break;
    case 'p-hoje': U.p.ref = hoje(); renderTudo(); break;
    case 'r-tipo': U.r.tipo = el.dataset.v; renderTudo(); break;
    case 'r-ant': U.r.ref = deslocarRef(U.r.tipo, U.r.ref, -1); renderTudo(); break;
    case 'r-prox': U.r.ref = deslocarRef(U.r.tipo, U.r.ref, 1); renderTudo(); break;
    case 'r-hoje': U.r.ref = hoje(); renderTudo(); break;
    case 'rel-html': { const m = relatorioAtual(); baixar(nomeArquivo(m, 'html'), buildRelatorio(m, { detalhado: U.r.detalhado }), 'text/html;charset=utf-8'); break; }
    case 'rel-pdf': { const fr = $('#prev'); if (fr && fr.contentWindow) { fr.contentWindow.focus(); fr.contentWindow.print(); } break; }
    case 'rel-csv': { const m = relatorioAtual(); baixar(nomeArquivo(m, 'csv'), csvTarefas(listaDoPeriodo(m)), 'text/csv;charset=utf-8'); break; }
    case 'rel-texto': { const ok = await copiarTexto(resumoTexto(relatorioAtual())); toast(ok ? 'Resumo copiado.' : 'Não foi possível copiar.', ok ? '' : 'erro'); break; }
    /* ajustes */
    case 'conectar': await conectar(); break;
    case 'desconectar':
      if (confirm('Desconectar da planilha? Os dados continuam lá. Este navegador volta a usar o modo local.')) { S.cfg.apiUrl = ''; S.cfg.token = ''; lsSet('pti.cfg', S.cfg); lsDel('pti.cache'); S.carregado = false; await carregar(); renderTudo(); }
      break;
    case 'migrar-local': await migrarLocal(); break;
    case 'salvar-config': await salvarAjustes(); break;
    case 'importar-notion': await importarNotion(); break;
    case 'reclassificar': await reclassificar(); break;
    case 'backup': baixar('planejamento-ti-backup-' + hoje() + '.json', montarBackup(), 'application/json'); break;
    case 'csv-tudo': baixar('planejamento-ti-' + hoje() + '.csv', csvTarefas(S.tarefas), 'text/csv;charset=utf-8'); break;
    case 'exemplo': {
      if (S.tarefas.length && !confirm('Já existem dados. Adicionar os exemplos junto?')) { break; }
      const g = gerarExemplo(); const d = lerLocal(); d.tarefas = d.tarefas.concat(g.tarefas); d.diario = d.diario.concat(g.diario); gravarLocal(d);
      await carregar(); renderTudo(); toast('Dados de exemplo carregados.'); break;
    }
    case 'apagar-local':
      if (confirm('Apagar todas as atividades guardadas neste navegador? Faça um backup antes se precisar.')) { lsDel('pti.local'); await carregar(); renderTudo(); toast('Dados locais apagados.'); }
      break;
    default: break;
  }
});

document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-form]');
  if (!f) { return; }
  ev.preventDefault();
  if (f.dataset.form === 'editor') { salvarEditor(f); }
  if (f.dataset.form === 'qadd') { const i = $('#qadd'); const v = i.value; i.value = ''; adicionarRapido(v, U.dia).then(() => { const n = $('#qadd'); if (n) { n.focus(); } }); }
});

document.addEventListener('change', async (ev) => {
  const el = ev.target;
  if (el.dataset.f) {
    if (el.type === 'checkbox') { U.f[el.dataset.f] = el.checked; } else { U.f[el.dataset.f] = el.value; }
    U.lim = 150; renderTudo(); return;
  }
  if (el.dataset.p === 'local') { U.p.local = el.value; renderTudo(); return; }
  if (el.dataset.r === 'local') { U.r.local = el.value; renderTudo(); return; }
  if (el.id === 'r-det') { U.r.detalhado = el.checked; renderTudo(); return; }
  if (el.id === 'r-de') { U.r.de = el.value; renderTudo(); return; }
  if (el.id === 'r-ate') { U.r.ate = el.value; renderTudo(); return; }
  if (el.id === 'dd-data') { if (el.value) { U.dd = el.value; renderTudo(); } return; }
  if (el.dataset.bulk) {
    const campo = el.dataset.bulk, valor = el.value;
    if (!valor) { return; }
    const l = selecionadas().map((x) => Object.assign({}, x, { [campo]: valor, revisar: campo === 'categoria' ? '' : x.revisar }));
    U.sel.clear(); await salvarTarefas(l); toast(l.length + ' atualizadas.'); return;
  }
  if (el.id === 'a-bkp' && el.files[0]) { await restaurarBackup(el.files[0]); el.value = ''; }
});

const salvarDiarioAgora = debounce(async (dia, txt) => {
  const st = $('#diario-st');
  if (st) { st.textContent = 'Salvando…'; }
  await salvarDiario(dia, txt);
  const s2 = $('#diario-st'); if (s2) { s2.textContent = 'Salvo'; setTimeout(() => { const s3 = $('#diario-st'); if (s3) { s3.textContent = ''; } }, 1800); }
}, 900);

const renderBusca = debounce(renderTudo, 200);

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'f-q') { U.f.q = el.value; U.lim = 150; renderBusca(); return; }
  if (el.id === 'diario-txt') { salvarDiarioAgora(el.dataset.dia, el.value); }
});

/* ---------- ajustes: ações ---------- */
async function conectar() {
  const url = $('#a-url').value.trim(), token = $('#a-token').value.trim();
  if (!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec$/.test(url)) { toast('A URL deve começar com https://script.google.com/macros/s/ e terminar em /exec.', 'erro'); return; }
  if (!token) { toast('Informe o token.', 'erro'); return; }
  const antes = { apiUrl: S.cfg.apiUrl, token: S.cfg.token };
  S.cfg.apiUrl = url; S.cfg.token = token;
  try {
    await chamarApi('ping');
  } catch (e) { S.cfg.apiUrl = antes.apiUrl; S.cfg.token = antes.token; toast(e.message, 'erro'); return; }
  lsSet('pti.cfg', S.cfg); S.carregado = false;
  await carregar(); renderTudo(); toast('Conectado à planilha.');
}

async function migrarLocal() {
  const d = lerLocal();
  if (!d.tarefas.length || !confirm('Enviar ' + d.tarefas.length + ' atividades e ' + d.diario.length + ' resumos para a planilha?')) { return; }
  try {
    for (let i = 0; i < d.tarefas.length; i += 400) { await chamarApi('saveTasks', { tarefas: d.tarefas.slice(i, i + 400) }); }
    for (const e of d.diario) { await chamarApi('saveDiary', { entrada: e }); }
    lsDel('pti.local'); await carregar(); renderTudo(); toast('Dados enviados para a planilha.');
  } catch (e) { toast('Falhou no envio: ' + e.message, 'erro'); }
}

async function salvarAjustes() {
  const lista = (id) => $(id).value.split('\n').map((s) => s.trim()).filter(Boolean);
  let cats = lista('#a-cats').filter((c) => c !== CATEGORIA_PADRAO); cats.push(CATEGORIA_PADRAO);
  if (cats.indexOf(CAT_FOLGA) < 0) { cats.splice(cats.length - 1, 0, CAT_FOLGA); }
  try {
    await salvarConfig({ empresa: $('#a-emp').value, responsavel: $('#a-resp').value, cargo: $('#a-cargo').value, categorias: cats, locais: lista('#a-locais') });
    renderTudo(); toast('Ajustes salvos.');
  } catch (e) { toast(e.message, 'erro'); }
}

async function importarNotion() {
  const tok = $('#a-ntoken').value.trim(), nid = $('#a-nid').value.trim();
  const box = $('#a-nres');
  if (!tok && !confirm('Sem token novo. Usar o último token guardado na planilha?')) { return; }
  box.innerHTML = '<p class="dica">Importando. Com milhares de itens pode levar alguns minutos…</p>';
  try {
    const r = await chamarApi('importNotion', { notionToken: tok, dataSourceId: nid });
    const cats = Object.keys(r.porCategoria || {}).map((k) => [k, r.porCategoria[k]]).sort((a, b) => b[1] - a[1]);
    box.innerHTML = `<p><b>${r.novas}</b> novas de ${r.lidas} lidas (${r.jaExistiam} já existiam, ${r.semTitulo} sem título).</p>` +
      `<p>${r.concluidas} concluídas, ${r.pendentes} pendentes, ${r.arquivadas} arquivadas, ${r.revisar} para revisar.</p>` +
      barrasHTML(cats.slice(0, 12).map((c) => ({ nome: c[0], a: c[1], cor: corCategoria(c[0]) })));
    S.carregado = false; await carregar(); renderTudo();
    const n2 = $('#a-nres'); if (n2) { n2.innerHTML = box.innerHTML; }
    toast('Importação concluída. Revise o que ficou em "A revisar".');
  } catch (e) { box.innerHTML = ''; toast(e.message, 'erro'); }
}

async function reclassificar() {
  const alvo = S.tarefas.filter((t) => t.categoria === CATEGORIA_PADRAO);
  const mud = alvo.map((t) => ({ t, c: classificarCategoria(t.titulo) })).filter((x) => x.c !== CATEGORIA_PADRAO && catsTodas().indexOf(x.c) >= 0);
  if (!mud.length) { toast('Nada novo para reclassificar.'); return; }
  await salvarTarefas(mud.map((x) => Object.assign({}, x.t, { categoria: x.c })));
  toast(mud.length + ' atividades reclassificadas.');
}

async function restaurarBackup(arq) {
  let d;
  try { d = JSON.parse(await arq.text()); } catch (e) { toast('Arquivo inválido.', 'erro'); return; }
  if (!d || d.app !== 'planejamento-ti' || !Array.isArray(d.tarefas)) { toast('Este arquivo não é um backup do Planejamento TI.', 'erro'); return; }
  const validas = d.tarefas.filter((t) => t && String(t.titulo || '').trim());
  const puladas = d.tarefas.length - validas.length;
  if (!confirm('Restaurar ' + validas.length + ' atividades?' + (puladas ? ' (' + puladas + ' sem título serão ignoradas.)' : '') + ' Itens com o mesmo código serão substituídos.')) { return; }
  try {
    if (validas.length) { await salvarTarefas(validas); }
    for (const e of (d.diario || [])) { await chamarApi('saveDiary', { entrada: e }); }
    await carregar(); renderTudo(); toast('Backup restaurado.' + (puladas ? ' ' + puladas + ' itens sem título foram ignorados.' : ''));
  } catch (e) { toast(e.message, 'erro'); }
}

/* ---------- atalhos ---------- */
let esperaG = false;
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) { return; }
  const alvo = ev.target, digitando = alvo && /^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName);
  if (ev.key === 'Escape' && $('#dlg').open) { $('#dlg').close(); return; }
  if (digitando || $('#dlg').open) { return; }
  const k = ev.key.toLowerCase();
  if (esperaG) {
    esperaG = false;
    const m = { h: 'hoje', s: 'semana', t: 'tarefas', p: 'painel', d: 'diario', r: 'relatorios', a: 'ajustes' }[k];
    if (m) { ev.preventDefault(); ir(m); }
    return;
  }
  if (k === 'g') { esperaG = true; setTimeout(() => { esperaG = false; }, 1200); return; }
  if (k === 'n') { ev.preventDefault(); abrirEditor(null); }
  if (k === '/') { ev.preventDefault(); if (U.view !== 'tarefas') { ir('tarefas'); } const q = $('#f-q'); if (q) { q.focus(); } }
});

$('#dlg').addEventListener('click', (ev) => { if (ev.target === $('#dlg')) { $('#dlg').close(); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== U.view) { ir(v); } });
window.addEventListener('online', () => { if (S.modo === 'remoto' && S.sync.estado === 'erro') { carregar().then(renderTudo); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.modo === 'remoto' && !S.gravando && !$('#dlg').open && document.activeElement.tagName !== 'TEXTAREA') { carregar().then(renderTudo); }
});

/* ---------- início ---------- */
(async function iniciar() {
  const est = document.createElement('style'); est.textContent = CSS_COMP; document.head.appendChild(est);
  const v = location.hash.slice(1);
  if (VIEWS[v]) { U.view = v; }
  try { await carregar(); } catch (e) { toast('Erro ao iniciar: ' + e.message, 'erro'); aplicarDados({ config: configPadrao(), tarefas: [], diario: [] }); }
  if (!S.tarefas.length && S.modo === 'local' && !S.cfg.visto) {
    S.cfg.visto = true; lsSet('pti.cfg', S.cfg);
    if (v !== 'ajustes') { U.view = 'ajustes'; }
  }
  $('#boot').remove();
  renderTudo();
  /* App instalável (PWA): só funciona servido por http/https, como na Vercel; aberto como arquivo local, é ignorado. */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sem modo offline; o app segue funcionando */ });
  }
})();

</script>
